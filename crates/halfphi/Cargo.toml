[package]
name = "halfphi"
version = "0.1.3"
edition = "2021"
description = "Switch-level simulation and analysis of transistor-level chip netlists"
license = "MIT"
repository = "https://github.com/tinymachines/6502"

# No dependencies, and no die data. Both are deliberate: see src/lib.rs.
[features]
# Records every group search the solver performs, for analysis. Off by default
# and opt-in at runtime even when built: recording allocates, and this engine's
# performance story is that a steady-state settle does not.
probe = []

[dependencies]
