[package]
name = "v6502-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Two builds of one crate, rather than two crates that drift.
#
#   default            embeds the 6502's die data. What the site ships, and
#                      what carries CC BY-NC-SA with it.
#   --no-default-...   no die data at all. `Machine.fromNetlist(bytes)` takes
#                      one at runtime, which is what lets the published
#                      package be MIT the way `halfphi` is.
default = ["mos6502"]
mos6502 = ["v6502-sim/mos6502", "dep:v6502-hybrid", "dep:v6502-compiled"]

[dependencies]
wasm-bindgen = "0.2.127"
halfphi = { path = "../halfphi" }

v6502-sim = { path = "../v6502-sim", default-features = false }
# Rung 1 behind the same surface. Optional and tied to `mos6502`: the hybrid
# netlist is derived from the schematic, which is derived from the die data,
# so it has no place in the data-free build.
v6502-hybrid = { path = "../v6502-hybrid", optional = true }
# Rung 2, same terms: the generated kernel is derived from the die data.
v6502-compiled = { path = "../v6502-compiled", optional = true }
