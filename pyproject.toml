[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "6502-expert-agent"
version = "0.1.0"
description = "A 6502 Processor Expert Agent using RAG with vector search"
readme = "CLAUDE.md"
requires-python = ">=3.6"
dependencies = [
    "requests>=2.32.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
]
