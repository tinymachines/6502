<!doctype html><html><head><meta charset="utf-8"><title>working</title></head><body>
<iframe id="f" style="width:1100px;height:900px;border:0"></iframe>
<script>
// The console resolves its API from its OWN query string, so a probe served
// from a directory with no /api behind it has to pass one through. Without a
// ?api= this is unchanged: the iframe loads "/" and the console uses its own
// origin, which is what the deployed site does.
{const a=new URLSearchParams(location.search).get("api");
 document.getElementById("f").src = a ? "/?api="+encodeURIComponent(a) : "/";}
</script>
<script type="module">
const R=[],ok=(n,c,x)=>R.push((c?"OK ":"FAIL ")+n+(x?" ["+String(x).replace(/\s+/g," ").slice(0,46)+"]":""));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const f=document.getElementById("f");
f.addEventListener("load",async()=>{
  const d=f.contentDocument, w=f.contentWindow;
  const q=s=>d.querySelector(s), T=s=>(q(s)||{}).textContent||"";
  const wait=async(fn,ms=60000)=>{const t=Date.now();while(Date.now()-t<ms){if(fn())return true;await sleep(120);}return false;};
  try{
    ok("the page loads", !!q("#screen"));
    await sleep(700);
    const cv=q("#screen"), g=cv.getContext("2d");
    const px=g.getImageData(0,0,cv.width,cv.height).data;
    const cols=new Set(); for(let i=0;i<px.length;i+=4) cols.add(px[i]+","+px[i+1]+","+px[i+2]);
    ok("the preview draws the starter tiles", cols.size>=4, cols.size+" colours at "+cv.width+"x"+cv.height);
    q("#b-power").click();
    ok("it boots on the live API", await wait(()=>T("#k-cart")!=="--"), T("#k-cart"));
    ok("...and runs frames", await wait(()=>+T("#k-frames")>=4), T("#k-frames")+" frames");
    // Bounded by the budget the console ENFORCES (console.js `frame(input,
    // budget = 20000)`), not by a remembered cost. This read <=1200 from the
    // day the console shipped, when the only cartridge cost 600 half-cycles a
    // frame; Die Runner costs 8704, which the mint tool reports too, so the
    // assertion had been failing for a year of cartridges being bigger rather
    // than anything being broken. A harness that is always red is one nobody
    // reads. Exceeding the budget is the real failure and it has its own
    // message ("did not raise its flag"), covered by "no error surfaced".
    ok("...at a cost inside the console's frame budget",
       /^\d+$/.test(T("#k-fc")) && +T("#k-fc")>0 && +T("#k-fc")<20000,
       T("#k-fc")+" half-cycles per frame, budget 20000");
    ok("...advancing the half-cycle counter", +T("#k-hc").replace(/,/g,"")>5000, T("#k-hc"));
    const a=g.getImageData(0,0,cv.width,cv.height).data.join(",");
    await wait(()=>+T("#k-frames")>=12);
    const b=g.getImageData(0,0,cv.width,cv.height).data.join(",");
    ok("the screen changes as it runs", a!==b);
    ok("no error surfaced", q("#err").hidden || !/stopped answering|could not boot|did not raise/.test(T("#err")), T("#err"));
    // One frame may already be in flight when pause is clicked -- a frame is a
    // request and the console cannot recall it -- so the honest assertion is
    // that no MORE than that lands. Requiring exactly zero made this red
    // whenever the click happened to fall inside a round trip, which is most
    // of the time at 200ms a frame.
    q("#b-pause").click(); const n=+T("#k-frames"); await sleep(1600);
    ok("pause stops the chip", +T("#k-frames") - n <= 1,
       n+" -> "+T("#k-frames")+" (one in-flight frame is allowed)");
    // parseInt, not unary plus: after a network retry the readout reads
    // "20 (1 retried)", which coerces to NaN and failed this check on a run
    // where the count itself was within tolerance.
    ok("one request per frame, as designed", Math.abs(parseInt(T("#k-req"), 10) - +T("#k-frames")) <= 3,
       T("#k-req")+" requests for "+T("#k-frames")+" frames");

    // The transport seam: with globalThis.tm6502Transport installed in the
    // page, the boot and every frame go through it and no HTTP request is
    // made. The fake here forwards to the real API so the game keeps
    // running, which is what lets it prove the seam is used for FRAMES and
    // not merely consulted once: the request counter must stand still while
    // frames advance, and start again when the global is deleted mid-game.
    // Without the seam the fake is never called. On a fresh boot, because
    // an unattended snake dies at about 26 frames and a game over stops the
    // loop for a reason that has nothing to do with the transport (the
    // first draft of this test found that out).
    {
      const apiBase=new URLSearchParams(w.location.search).get("api")||(w.location.origin+"/api");
      const calls=[];
      w.tm6502Transport=(path,body)=>{calls.push(path);
        return w.fetch(apiBase+"/v1/"+path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)}).then(r=>r.json());};
      q("#b-power").click();   // a new console: its request counter starts at 0
      const ran=await wait(()=>calls.includes("boot") && +T("#k-frames")>=4, 30000);
      ok("with tm6502Transport installed, the boot and the frames go through it", ran && calls.filter(c=>c==="step").length>=4,
         calls.length+" calls ("+calls.filter(c=>c==="boot").length+" boot), "+T("#k-frames")+" frames, err="+T("#err"));
      ok("...and no HTTP request is counted", parseInt(T("#k-req"),10)===0,
         T("#k-req")+" requests");
      delete w.tm6502Transport;
      const n1=calls.length, fr1=+T("#k-frames");
      const ran2=await wait(()=>+T("#k-frames")>=fr1+4, 30000);
      ok("deleting it mid-game hands the running game back to fetch", ran2 && parseInt(T("#k-req"),10)>0 && calls.length===n1,
         T("#k-req")+" requests, "+calls.length+" calls, "+(+T("#k-frames")-fr1)+" frames, err="+T("#err"));
      q("#b-pause").click();
    }

    // Changing the cartridge WHILE a boot is in flight. power() decides things
    // before two awaits; without rechecking the generation after them it
    // resumed into a cancelled boot, repainted the buttons as live, wrote the
    // new cartridge's name against the old ROM's byte count, and built the
    // console from the new contract over the old bytes. Its loop then exited
    // at once on the stale generation, so the console read live with nothing
    // running. Reported from the apex site's console shell with a repro.
    const sel=q("#cart");
    if (sel && sel.options.length > 1) {
      const first=sel.value;
      q("#b-power").click();                 // boot starts, awaits begin
      // Poll for the effect the click writes, do not sleep a guessed number of
      // milliseconds past it: the boot's long await is an API round trip, and
      // a fixed sleep either lands outside the window or races it. An earlier
      // version slept 40ms and passed against the UNFIXED console, which makes
      // it a test that cannot fail.
      await wait(()=>T("#b-power")==="booting...", 4000);
      sel.value=[...sel.options].map(o=>o.value).find(v=>v!==first);
      sel.dispatchEvent(new w.Event("change"));
      await sleep(3000);                     // let the cancelled boot land
      ok("changing the cartridge mid-boot cancels the boot",
         T("#b-power")==="power on" && T("#k-cart")==="--",
         "power=\""+T("#b-power")+"\" cart=\""+T("#k-cart")+"\"");
      ok("...and does not leave a console reporting live with nothing running",
         !(T("#b-power")==="reset" && T("#k-frames")==="0"),
         "power=\""+T("#b-power")+"\" frames="+T("#k-frames"));
    }

    // `data-frame-ms` paces the loop. A frame is a request of about 200ms, so
    // unpaced this manages roughly 15 in three seconds; asking for 900ms
    // periods must bring that to three or four. The attribute is read every
    // frame, so it is set here on a console that is already booted.
    d.body.dataset.frameMs = "900";
    q("#b-power").click();
    if (await wait(()=>T("#b-power")==="reset", 30000)) {
      const before=+T("#k-frames");
      await sleep(3000);
      const paced=+T("#k-frames")-before;
      ok("data-frame-ms paces the loop", paced>0 && paced<=5,
         paced+" frames in 3s at a 900ms period (unpaced is about 15)");
    } else {
      ok("data-frame-ms paces the loop", false, "the console did not boot");
    }
    delete d.body.dataset.frameMs;

    // The sheet is a property of the cartridge, not of the page. Load a
    // cartridge whose tiles differ from the house set, then choose a built-in
    // one from the picker: it must draw in the house set again. The legend is
    // the witness, because the page paints it from the same TILES the screen
    // draws from; comparing canvases would compare two games at whatever
    // frame each had reached. dierunner.cart.gz ships the house tiles byte
    // for byte, so it is fetched, its tile bytes inverted and re-gzipped: a
    // fixture derived here rather than a binary committed. Without the fix
    // the second assertion times out with the legend still inverted.
    const swatches=(doc)=>[...doc.querySelectorAll(".legend i")].map(i=>i.style.backgroundImage).join("\n");
    const apiParam=new URLSearchParams(location.search).get("api");
    // The baseline is a FRESH plain page after its sheet has landed, not the
    // page the sections above drove. A loader that never records the house
    // sheet leaves the picker restoring the STARTER set, and the mid-boot
    // test above changes the picker, so a baseline taken from that page was
    // the starter legend: the restore case then compared starter with
    // starter and passed against the mutant it exists to catch. Measured.
    const fresh=new Promise(r=>f.addEventListener("load",r,{once:true}));
    f.src="/"+(apiParam?"?api="+encodeURIComponent(apiParam):"");
    await fresh;
    const d0=f.contentDocument;
    await fetch("/art/tiles.chr",{cache:"no-cache"});   // resolves after the page's own
    await sleep(300);
    const house=swatches(d0);
    const gz=await (await fetch("/dierunner.cart.gz")).arrayBuffer();
    const cartDoc=JSON.parse(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
    cartDoc.meta=Object.assign({},cartDoc.meta,{name:"Inverted"});
    cartDoc.tiles.chr=cartDoc.tiles.chr.match(/../g).map(h=>(255-parseInt(h,16)).toString(16).padStart(2,"0")).join("");
    const fixture=await new Response(new Blob([JSON.stringify(cartDoc)]).stream().pipeThrough(new CompressionStream("gzip"))).blob();
    const fixtureUrl=URL.createObjectURL(fixture);
    const reloaded=new Promise(r=>f.addEventListener("load",r,{once:true}));
    f.src="/?cart="+encodeURIComponent(fixtureUrl)+(apiParam?"&api="+encodeURIComponent(apiParam):"");
    await reloaded;
    const d2=f.contentDocument, w2=f.contentWindow, q2=s=>d2.querySelector(s), T2=s=>(q2(s)||{}).textContent||"";
    const linked=await wait(()=>/Inverted/.test(T2("#k-cart")), 15000);
    ok("a linked cartridge loads and draws in its own tiles", linked && swatches(d2)!==house,
       linked ? "legend differs from a plain page's, as it must" : "the fixture did not load: "+T2("#err"));
    const sel2=q2("#cart"); sel2.value="0"; sel2.dispatchEvent(new w2.Event("change"));
    const restored=await wait(()=>swatches(d2)===house, 3000);
    ok("choosing a built-in cartridge afterwards restores the house tiles", restored,
       restored ? "legend byte-identical to a plain page's" : "legend still shows the linked cartridge's sprites");

    // The other half of the same bug, and the half that needs a slow server
    // to show. art/tiles.chr and a linked cartridge are two fetches the page
    // starts together, and on the live console their responses land about
    // two milliseconds apart: a coin toss, not a corner. When the sheet lands
    // SECOND, the loader used to install it over the cartridge's own set and
    // the linked cartridge drew in the house tiles. games/tools/probe-serve.py
    // holds the sheet back on request; this case runs only when the probe is
    // told that it did, and says so otherwise rather than passing on nothing.
    const slow=+new URLSearchParams(location.search).get("slow-sheet")||0;
    if (slow) {
      const again=new Promise(r=>f.addEventListener("load",r,{once:true}));
      f.src="/?cart="+encodeURIComponent(fixtureUrl)+(apiParam?"&api="+encodeURIComponent(apiParam):"");
      await again;
      const d3=f.contentDocument, q3=s=>d3.querySelector(s), T3=s=>(q3(s)||{}).textContent||"";
      // A timeline of what the legend showed, so the case asserts the ORDER
      // it needed and not just the outcome. Under --virtual-time-budget the
      // first version of this passed against the unfixed loader: virtual
      // time pauses while a fetch is pending, the cartridge's decode waited
      // behind the delayed sheet, the sheet won the race in the page every
      // time, and nothing was ever there to clobber. A test that cannot fail
      // is not a test; this one fails if the cartridge did not win.
      const t0=performance.now(); const seen=[];
      const tick=()=>{const s=swatches(d3); if(!seen.length||seen[seen.length-1].s!==s) seen.push({s, at:Math.round(performance.now()-t0)});};
      const poll=setInterval(tick,50);
      // A MutationObserver, not the polling wait(): under the budget, timers
      // do not fire while the delayed sheet is pending, so a poll that missed
      // the cartridge at load next looked AFTER the sheet had landed and
      // captured the clobbered legend as "own". Microtasks run either way.
      const untilLinked=new Promise((res)=>{
        const el=q3("#k-cart");
        if(/Inverted/.test(el.textContent)) return res(true);
        const mo=new MutationObserver(()=>{ if(/Inverted/.test(el.textContent)){ mo.disconnect(); res(true); } });
        mo.observe(el,{childList:true,characterData:true,subtree:true});
      });
      const linked3=await Promise.race([untilLinked, sleep(15000).then(()=>false)]);
      tick(); const own=swatches(d3);
      // Wait for the sheet to LAND, not for a guessed number of milliseconds.
      // The probe's own fetch of the same file, started after the page's,
      // goes through the same delay and resolves after it.
      await fetch("/art/tiles.chr", {cache:"no-cache"});
      await sleep(300); tick(); clearInterval(poll);
      const label=s=> s===house?"house" : s===own?"cart" : s.length?"starter":"none";
      const order=seen.map(e=>label(e.s)+"@"+e.at+"ms").join(" > ");
      const firstHouse=seen.findIndex(e=>e.s===house), firstCart=seen.findIndex(e=>e.s===own);
      const cartWon=firstCart>=0 && (firstHouse<0 || firstCart<firstHouse);
      const kept=swatches(d3)===own;
      ok("a linked cartridge keeps its own tiles when the house sheet lands second",
         linked3 && own!==house && cartWon && kept,
         !linked3 ? "the fixture did not load: "+T3("#err")
         : !cartWon ? "NO POWER, the sheet landed before the cartridge: "+order
         : kept ? "kept, order "+order
         : "the house sheet replaced the cartridge's tiles: "+order);
    } else {
      R.push("SKIP the delayed-sheet case: serve with games/tools/probe-serve.py --delay art/tiles.chr=1500 and pass ?slow-sheet=1500");
    }
  }catch(e){ R.push("FAIL threw: "+e.message); }
  const bad=R.filter(r=>r.indexOf("FAIL")===0);
  document.title=(bad.length?"RED "+bad.length+" :: ":"ALL PASS :: ")+R.join(" | ");
},{once:true});
</script></body></html>
