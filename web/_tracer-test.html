<!doctype html>
<!--
  Development harness, never shipped: build-web.py copies only the files it
  names, so nothing here reaches dist/.

  The tracer's claim is that the whole circuit is on screen at its own die
  positions and that, at each half-cycle, every mark is a comparison of two
  readings of the chip: a ring is a node whose level changed, a flashed line a
  gate whose output changed, a bright line a switch whose control is high. So
  the harness runs a chip of its OWN to the same half-cycle and recomputes all
  of it: the changed set, the levels, the fired and toggled edges, the watch
  bytes, the current line of the code, and the positions from layout.bin. A
  page that lit the right number of things for the wrong reason would pass a
  count and fail these.

  It boots the real page in an iframe under a deep link that exercises the
  program, step, watch, fly and only parameters at once, then drives it.

    http://localhost:8777/_tracer-test.html
-->
<html lang="en"><head><meta charset="utf-8"><title>pending</title>
<style>body{margin:0;background:#0b1120;color:#eaf2ff;font:12px ui-monospace,monospace}
iframe{width:1400px;height:1000px;border:0}pre{padding:1rem;white-space:pre-wrap}</style>
</head><body>
<iframe id="f" src="tracer.html?program=1&step=41&watch=abl,pcl,nosuch&fly=abl&only=1"></iframe>
<script type="module">
import init, { Machine } from './pkg/v6502_wasm.js';
import { PROGRAMS, LOAD_ADDR } from './programs.js';

const results = [];
const ok = (n, c, d) => { results.push(`${c ? 'PASS' : 'FAIL'} ${n}${d ? ' :: ' + d : ''}`); document.title = `running ${results.length}`; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.getElementById('f');
const hex2 = (v) => v.toString(16).padStart(2, '0').toUpperCase();
const hex4 = (v) => v.toString(16).padStart(4, '0').toUpperCase();

f.addEventListener('load', async () => {
  const d = f.contentDocument;
  const w = f.contentWindow;
  const $ = (id) => d.getElementById(id);
  try {
    for (let i = 0; i < 400 && $('tc-main').hidden; i++) await sleep(50);
    ok('the page booted', !$('tc-main').hidden, $('tc-status').textContent);
    for (let i = 0; i < 100 && !w.__tracer; i++) await sleep(50);
    const T = w.__tracer;
    const st = T.state;

    // --- an independent chip, and the published files -------------------------
    await init();
    const [sch, buf] = await Promise.all([
      fetch('schematic.json').then((r) => r.json()),
      fetch('layout.bin').then((r) => r.arrayBuffer()),
    ]);
    const rails = new Set([sch.vss, sch.vcc]);
    const byName = new Map(sch.names.map((n, i) => [n, i]).filter(([n]) => n));
    const prog = PROGRAMS[1];
    const m = new Machine();
    m.load(LOAD_ADDR, new Uint8Array(prog.bytes));
    m.setResetVector(LOAD_ADDR);
    m.powerCycle();
    const runTo = (h) => { while (m.halfCycle() < h) m.halfStep(); };
    // Levels at h-1 and h, from the harness's chip.
    const pair = (h) => { runTo(h - 1); const a = m.nodeLevels(); m.halfStep(); return [a, m.nodeLevels()]; };
    const changedBetween = (a, b) => { const c = []; for (let i = 0; i < a.length; i++) if (a[i] !== b[i] && !rails.has(i)) c.push(i); return c; };

    // --- the deep link -----------------------------------------------------------
    ok('?program=1 chose the second program on the page and in the header',
       $('tc-program').value === '1' && d.querySelector('.nav-prog select')?.value === '1'
       && $('tc-code').textContent.includes(prog.name), `${$('tc-program').value} / ${prog.name}`);
    ok('?step=41 landed on half-cycle 41', st.m.halfCycle() === 41 && /half-cycle 41\b/.test($('tc-head').textContent), $('tc-head').textContent.slice(0, 40));
    ok('?watch= set the watch, and an unknown stem says so rather than vanishing',
       $('tc-watch-input').value === 'abl pcl nosuch' && [...d.querySelectorAll('#tc-watch .tc-w')].length === 3
       && /no such stem/.test(d.querySelector('#tc-watch .tc-w-none')?.textContent || ''), $('tc-watch-input').value);
    const vb = () => $('tc-svg').getAttribute('viewBox').split(' ').map(Number);
    ok('?fly=abl framed the drawing on the latch rather than the whole die', vb()[2] < st.home[2] * 0.6, `view ${vb()[2].toFixed(0)} of ${st.home[2].toFixed(0)}`);
    ok('?only=1 turned on "only what moved"', $('tc-only').getAttribute('aria-pressed') === 'true' && $('tc-cam').classList.contains('only'));
    ok('the header carries the program picker and the transport on this page',
       !!d.querySelector('.nav-prog select') && !!d.querySelector('.nav-transport'));

    // --- the drawing is the die graph -------------------------------------------
    const dv = new DataView(buf);
    const vertexCount = dv.getUint32(12, true);
    const xmin = dv.getUint16(24, true), ymin = dv.getUint16(26, true), xmax = dv.getUint16(28, true), ymax = dv.getUint16(30, true);
    const vertexOffset = dv.getUint32(32, true);
    const sx = new Float64Array(2048), sy = new Float64Array(2048), cnt = new Uint32Array(2048);
    for (let i = 0; i < vertexCount; i++) {
      const o = vertexOffset + i * 6;
      const nd = dv.getUint16(o + 4, true);
      sx[nd] += dv.getUint16(o, true); sy[nd] += dv.getUint16(o + 2, true); cnt[nd] += 1;
    }
    const mine = new Map();
    for (let nd = 0; nd < 2048; nd++) if (cnt[nd]) mine.set(nd, { x: sx[nd] / cnt[nd], y: ymax - (sy[nd] / cnt[nd]) + ymin });
    const circles = () => [...d.querySelectorAll('#tc-svg .tc-n')];
    const off = [];
    for (const c of circles()) {
      const nd = Number(c.dataset.node);
      const p = mine.get(nd);
      if (!p) { off.push(`${nd} has no geometry`); continue; }
      if (Math.abs(Number(c.getAttribute('cx')) - p.x) > 0.6 || Math.abs(Number(c.getAttribute('cy')) - p.y) > 0.6) off.push(`${nd} off`);
    }
    ok('every node is drawn at the centroid of its own polygons', off.length === 0, off.slice(0, 3).join(' | ') || `${circles().length} checked`);
    ok('and neither rail is drawn', !circles().some((c) => rails.has(Number(c.dataset.node))));

    // --- the block regions, checked against the rule rather than the module ------
    // A region is every point within REGION_R of a member of the block. The SVG's
    // own hit test (isPointInFill) decides what the page drew, and the rule is
    // re-derived here from schematic.json and the centroids, so the module that
    // traced the outline is not consulted.
    {
      const R = w.__tracer.REGION_R ?? 300, CELL = w.__tracer.REGION_CELL ?? 50;
      const paths = [...d.querySelectorAll('#tc-regions .tc-rg')];
      const nBlocks = sch.blockNames.length - 2;  // neither the residue nor the static logic
      ok(`one region per functional block: ${nBlocks}`, paths.length === nBlocks
         && paths.every((p) => Number(p.dataset.block) >= 1 && Number(p.dataset.block) <= nBlocks), `${paths.length} paths`);
      ok('each carries a label with the block\'s name',
         paths.every((p) => { const t = d.querySelector(`#tc-regions .tc-rg-lb[data-block="${p.dataset.block}"]`); return t && t.textContent === sch.blockNames[Number(p.dataset.block)]; }));
      const svg = $('tc-svg');
      const pt = svg.createSVGPoint();
      const hits = (path, x, y) => { pt.x = x; pt.y = y; return path.isPointInFill(pt); };
      const byBlock = new Map(paths.map((p) => [Number(p.dataset.block), p]));
      const membersOf = new Map();
      for (const [n, p] of mine) {
        if (rails.has(n)) continue;
        const b = sch.nodeBlock[n] & 0x7f;
        if (!byBlock.has(b)) continue;
        if (!membersOf.has(b)) membersOf.set(b, []);
        membersOf.get(b).push(p);
      }
      let outMembers = 0, members = 0;
      for (const [b, pts] of membersOf) for (const p of pts) { members++; if (!hits(byBlock.get(b), p.x, p.y)) outMembers++; }
      ok('every member node lies inside its own block\'s region, by the SVG\'s own hit test', outMembers === 0, `${outMembers} of ${members} outside`);
      // The rule on a lattice of sample points: inside iff the nearest member is
      // within R, judged only where the point is more than a cell from the line.
      let tested = 0, wrong = 0;
      const stepX = (xmax - xmin) / 60, stepY = (ymax - ymin) / 60;
      for (const [b, pts] of membersOf) {
        const path = byBlock.get(b);
        for (let x = xmin; x <= xmax; x += stepX) for (let y = ymin; y <= ymax; y += stepY) {
          let dmin = Infinity;
          for (const p of pts) { const dd = Math.hypot(p.x - x, p.y - y); if (dd < dmin) dmin = dd; }
          if (Math.abs(dmin - R) <= CELL * 1.5) continue;
          tested++;
          if (hits(path, x, y) !== (dmin <= R)) wrong++;
        }
      }
      ok(`and on a lattice of sample points the drawing agrees with the rule "within ${R} of a member"`, tested > 5000 && wrong === 0, `${wrong} of ${tested} disagree`);
      // The caption's overlap count, recounted with the hit test.
      let shared = 0;
      for (const [b, pts] of membersOf) for (const p of pts) {
        for (const [ob, path] of byBlock) if (ob !== b && hits(path, p.x, p.y)) { shared++; break; }
      }
      const cap = $('tc-caption').textContent;
      ok('the caption\'s overlap count is what the hit test counts', cap.includes(`${shared} of the ${members} block nodes`), `harness ${shared} of ${members} :: ${cap.slice(cap.indexOf('overlap'), cap.indexOf('overlap') + 90)}`);
      ok('the overlap is real, not a rounding: more than a fifth of block nodes sit in another region', shared / members > 0.2, `${Math.round(100 * shared / members)}%`);
      const capPieces = Number((cap.match(/(\d+) pieces in all/) || [])[1]);
      ok('the caption counts more pieces than blocks, so a block is not claimed to be one place', capPieces > nBlocks, `${capPieces} pieces`);
      // The toggle hides the group and the button says so.
      w.__tracer.setRegions(false);
      ok('the toggle hides the regions', w.getComputedStyle($('tc-regions')).display === 'none' && $('tc-regions-btn').getAttribute('aria-pressed') === 'false');
      w.__tracer.setRegions(true);
      ok('and shows them again', w.getComputedStyle($('tc-regions')).display !== 'none');
      // The labels go once the reader is zoomed past LABEL_ZOOM.
      const lbl = d.querySelector('#tc-regions .tc-rg-lb');
      ok('a region label is shown at fit', w.getComputedStyle(lbl).display !== 'none');
      w.__tracer.frameNodes([byName.get('a0')]);
      ok('and hidden once node labels arrive', w.getComputedStyle(lbl).display === 'none', `zoom class ${$('tc-cam').className}`);
      w.__tracer.setView(w.__tracer.state.home.slice());
      // A point well outside the die is in no region.
      ok('the die\'s far corner is in no region', ![...byBlock.values()].some((p) => hits(p, xmax + 2000, ymax + 2000)));

      // --- clicking a region selects a block --------------------------------------
      // Real clicks at real screen points, with the target taken from
      // elementFromPoint, so the path has to be hit-testable and on top of
      // whatever the page put there. The die point is chosen from the lattice:
      // inside exactly one region and clear of every node, so the click can
      // only mean one thing; then a point inside two regions, where the page
      // must choose the block with the nearest member.
      const nearest = (x, y) => { let bb = null, bd = Infinity; for (const [b, pts] of membersOf) for (const p of pts) { const dd = Math.hypot(p.x - x, p.y - y); if (dd < bd) { bd = dd; bb = b; } } return [bb, bd]; };
      const containing = (x, y) => [...byBlock].filter(([, p]) => hits(p, x, y)).map(([b]) => b);
      const toClient = (x, y) => { const m = svg.getScreenCTM(); pt.x = x; pt.y = y; const q = pt.matrixTransform(m); return { x: q.x, y: q.y }; };
      // The drawing has to be on screen for elementFromPoint to reach it, and
      // it is scrolled there before every click rather than once: the page
      // scrolls the document while it boots and paints.
      // Scrolling the iframe's document headlessly turned out to do nothing,
      // so the iframe itself is made tall enough to hold the drawing unscrolled.
      f.style.height = '2600px';
      await sleep(100);
      const clickAt = (x, y) => {
        const c = toClient(x, y);
        const target = d.elementFromPoint(c.x, c.y);
        target.dispatchEvent(new w.MouseEvent('click', { bubbles: true, clientX: c.x, clientY: c.y }));
        return target;
      };
      const allPts = [...mine.values()];
      const clearOfNodes = (x, y) => allPts.every((p) => Math.hypot(p.x - x, p.y - y) > 120);
      let solo = null, dual = null;
      for (let x = xmin; x <= xmax && !(solo && dual); x += stepX) for (let y = ymin; y <= ymax; y += stepY) {
        const cs = containing(x, y);
        if (!clearOfNodes(x, y)) continue;
        if (cs.length === 1 && !solo) solo = { x, y, b: cs[0] };
        if (cs.length >= 2 && !dual) { const [nb] = nearest(x, y); if (cs.includes(nb) && cs.some((b) => b !== nb)) dual = { x, y, b: nb, cs }; }
      }
      ok('the lattice offers a point inside exactly one region and one inside two', !!solo && !!dual, `${solo && sch.blockNames[solo.b]} / ${dual && dual.cs.map((b) => sch.blockNames[b]).join('+')} -> ${dual && sch.blockNames[dual.b]}`);
      const tgt = clickAt(solo.x, solo.y);
      ok('a click on a region lands on the region path', tgt.classList.contains('tc-rg'), `${tgt.tagName}.${tgt.className.baseVal} at client ${JSON.stringify(toClient(solo.x, solo.y))}, svg rect ${JSON.stringify(svg.getBoundingClientRect())}, viewport ${w.innerWidth}x${w.innerHeight}, view ${st.view.map(Math.round)}`);
      ok('and selects that block', st.block === solo.b, `${st.block} vs ${solo.b}`);
      ok('the region is marked selected and the others are not', byBlock.get(solo.b).classList.contains('sel') && [...byBlock.values()].filter((p) => p.classList.contains('sel')).length === 1);
      let cls = 0, bad = 0;
      for (const c of circles()) { const mem = (sch.nodeBlock[Number(c.dataset.node)] & 0x7f) === solo.b; if (c.classList.contains('sel-out') === mem) bad++; else cls++; }
      ok('every node outside the block steps back and every member does not', bad === 0, `${bad} wrong of ${cls}`);
      const eb = st.edges.filter((e) => { const m = ((sch.nodeBlock[e.a] & 0x7f) === solo.b) || ((sch.nodeBlock[e.b] & 0x7f) === solo.b); return e.el.classList.contains('sel-out') === m; }).length;
      ok('an edge stays exactly when either end is in the block', eb === 0, `${eb} wrong`);
      const card = $('tc-block').textContent;
      const drawnB = circles().filter((c) => (sch.nodeBlock[Number(c.dataset.node)] & 0x7f) === solo.b).length;
      const movedB = st.changed.filter((n) => (sch.nodeBlock[n] & 0x7f) === solo.b).length;
      ok('the block card names it and counts its drawn and moved nodes', card.startsWith(sch.blockNames[solo.b]) && card.includes(`${membersOf.get(solo.b).length} nodes, ${drawnB} drawn`) && card.includes(`${movedB} moved`), card);
      ok('and links to its page', !!$('tc-block').querySelector('a[href^="block?b="]'));
      ok('the moved list marks the block\'s group and dims the rest', [...d.querySelectorAll('#tc-moved .tc-blk')].every((g) => g.classList.contains(g.querySelector('h4').textContent.trim().startsWith(sch.blockNames[solo.b]) ? 'sel' : 'sel-out')));
      clickAt(dual.x, dual.y);
      ok('where two regions overlap, the click goes to the block with the nearest member', st.block === dual.b, `got ${sch.blockNames[st.block]}, wanted ${sch.blockNames[dual.b]} of ${dual.cs.map((b) => sch.blockNames[b]).join('+')}`);
      clickAt(dual.x, dual.y);
      ok('clicking the selected block again clears it', st.block === null && !$('tc-cam').classList.contains('has-sel') && !circles().some((c) => c.classList.contains('sel-out')));
      w.__tracer.soloBlock = solo.b;  // for the stepping check at the end, which moves the chip
      f.style.height = '1000px';
      // A deep link selects by slug and frames the block. The instruction
      // register rather than the ALU, because the ALU's bit slices run most of
      // the die's height and framing it barely zooms, which is correct.
      const f2 = d.createElement('iframe');
      f2.style.cssText = 'position:fixed;left:0;top:0;width:1200px;height:900px;opacity:0;pointer-events:none';
      d.body.appendChild(f2);
      await new Promise((res) => { f2.addEventListener('load', res, { once: true }); f2.src = 'tracer.html?block=instruction-register&step=4'; });
      for (let i = 0; i < 200 && !(f2.contentWindow.__tracer && !f2.contentDocument.getElementById('tc-main').hidden); i++) await sleep(50);
      const T2 = f2.contentWindow.__tracer;
      const irId = sch.blockNames.indexOf('Instruction register');
      ok('?block=instruction-register selects the instruction register', T2 && T2.state.block === irId, `${T2 && T2.state.block}`);
      ok('and frames it: the view is narrower than the whole die', T2 && T2.state.view[2] < T2.state.home[2] * 0.8, `${T2 && Math.round(T2.state.view[2])} of ${T2 && Math.round(T2.state.home[2])}`);
      f2.remove();
    }
    // The full graph, counted independently.
    const seen = new Set(); let want = 0;
    const keep = (n) => mine.has(n) && !rails.has(n);
    const push = (a, b, k) => { if (a === b || !keep(a) || !keep(b)) return; const key = a < b ? `${a}:${b}:${k}` : `${b}:${a}:${k}`; if (seen.has(key)) return; seen.add(key); want++; };
    for (const [out, , , legs] of sch.gates) for (const i of new Set(legs.flat())) push(i, out, 'gate');
    for (const [, a, b] of sch.switches) push(a, b, 'switch');
    const edgesEl = () => [...d.querySelectorAll('#tc-svg .tc-e')];
    ok('the default view is every node, and the edge count is the netlist\'s own',
       edgesEl().length === want && circles().some((c) => !sch.names[Number(c.dataset.node)]), `page ${edgesEl().length}, harness ${want}`);
    // Precharged nodes: the dashed outline marks exactly the dynamic gate
    // outputs in schematic.json, counted here from the file rather than from
    // the page. The drawn set is the intersection with what is on screen, and
    // it must be non-empty, or a missing class passes vacuously.
    const dyn = sch.kinds.indexOf('dynamic');
    const wantPre = new Set(sch.gates.filter((g) => g[1] === dyn).map((g) => g[0]));
    const drawnNodes = new Set(circles().map((c) => Number(c.dataset.node)));
    const wantPreDrawn = [...wantPre].filter((n) => drawnNodes.has(n)).sort((a, b) => a - b);
    const gotPre = circles().filter((c) => c.classList.contains('tc-pre')).map((c) => Number(c.dataset.node)).sort((a, b) => a - b);
    ok('the dashed outline marks exactly the precharged (dynamic) gate outputs',
       gotPre.length > 0 && gotPre.join() === wantPreDrawn.join(), `page ${gotPre.length}, harness ${wantPreDrawn.length} of ${wantPre.size} dynamic gates`);
    // A ring for a change outranks the dash, so compare two nodes at rest.
    const resting = (c) => !['chg', 'was', 'wt', 'on-pick'].some((k) => c.classList.contains(k));
    const preDash = circles().find((c) => c.classList.contains('tc-pre') && resting(c));
    const solid = circles().find((c) => !c.classList.contains('tc-pre') && resting(c));
    ok('and the outline really is dashed, where a solid node is not',
       w.getComputedStyle(preDash).strokeDasharray !== 'none' && w.getComputedStyle(solid).strokeDasharray === 'none',
       `${w.getComputedStyle(preDash).strokeDasharray} vs ${w.getComputedStyle(solid).strokeDasharray}`);
    const syncN = byName.get('sync');
    ok('sync is one of them, as the schematic reports it', wantPre.has(syncN) && st.nodeEl.get(syncN)?.classList.contains('tc-pre'));
    w.__tracer.pick(syncN);
    const syncUp = sch.gates.find((g) => g[0] === syncN)[2];
    ok('and the picked-node line names what pulls it up', $('tc-picked').textContent.includes(`pulled to vcc by ${sch.names[syncUp] || `unnamed node ${syncUp}`}`), $('tc-picked').textContent);
    w.__tracer.pick(byName.get('a0'));
    ok('where a plain wire says nothing of the kind', !/pulled to vcc/.test($('tc-picked').textContent), $('tc-picked').textContent);
    w.__tracer.pick(null);

    // --- what moved at half-cycle 41, against the harness chip ---------------------
    const [L40, L41] = pair(41);
    const chg41 = changedBetween(L40, L41);
    const drawn = new Set(circles().map((c) => Number(c.dataset.node)));
    const ringed = circles().filter((c) => c.classList.contains('chg')).map((c) => Number(c.dataset.node)).sort((a, b) => a - b);
    const wantRinged = chg41.filter((n) => drawn.has(n)).sort((a, b) => a - b);
    ok('the ringed nodes are exactly the drawn nodes whose level changed at this half-cycle',
       ringed.join() === wantRinged.join(), `${ringed.length} ringed, harness ${wantRinged.length}, of ${chg41.length} changed`);
    ok('the moved list counts them, and the head line names the half-cycle',
       new RegExp(`^${chg41.length} nodes changed level`).test($('tc-moved-sum').textContent), $('tc-moved-sum').textContent);
    let hiBad = 0;
    for (const c of circles()) if (c.classList.contains('hi') !== (L41[Number(c.dataset.node)] > 0)) hiBad++;
    ok('every drawn node is lit exactly when the harness chip has it high', hiBad === 0, `${hiBad} wrong`);
    // Edges: fired = gate edge whose output moved; on = switch conducting; tog = control moved.
    const chgSet = new Set(chg41);
    let edgeBad = 0, fired = 0, tog = 0, on = 0;
    const gateOut = new Map();
    for (const [out, , , legs] of sch.gates) for (const i of new Set(legs.flat())) gateOut.set(`${i}:${out}`, out);
    for (let i = 0; i < st.edges.length; i++) {
      const e = st.edges[i];
      const cls = e.el.classList;
      if (e.kind === 'gate') {
        const wantFired = chgSet.has(e.out);
        if (cls.contains('fired') !== wantFired) edgeBad++;
        if (wantFired) fired++;
      } else {
        const wantOn = L41[e.control] > 0, wantTog = chgSet.has(e.control);
        if (cls.contains('on') !== wantOn || cls.contains('tog') !== wantTog) edgeBad++;
        if (wantOn) on++;
        if (wantTog) tog++;
      }
    }
    ok('flashed lines are gates whose output moved; bright and marked lines are switches by their control',
       edgeBad === 0 && fired > 0 && tog > 0 && on > 0, `${edgeBad} wrong; ${fired} fired, ${on} on, ${tog} toggled`);
    // The watch: bits from the harness levels.
    const watchVal = (stem) => { let v = 0; for (let b = 0; b < 16; b++) { const n = byName.get(`${stem}${b}`); if (n !== undefined && L41[n]) v |= 1 << b; } return v; };
    const rowVal = (stem) => d.querySelector(`#tc-watch [data-stem="${stem}"] .tc-w-v`)?.textContent;
    ok('the watch rows read the bits the harness reads',
       rowVal('abl') === `$${hex2(watchVal('abl'))}` && rowVal('pcl') === `$${hex2(watchVal('pcl'))}`, `abl ${rowVal('abl')} pcl ${rowVal('pcl')}`);
    const movedBits = [...d.querySelectorAll('#tc-watch [data-stem="abl"] .tc-lamps i.moved')].length;
    const wantMoved = [...Array(8).keys()].filter((b) => chgSet.has(byName.get(`abl${b}`))).length;
    ok('and mark the bits that moved this half-cycle', movedBits === wantMoved, `${movedBits} vs ${wantMoved}`);
    // --- the bus and latch capsules ---------------------------------------------
    // The set is re-derived here from the names by the stated rule, the
    // geometry checked with the SVG's hit test, and a click on a capsule that
    // also lies in a block region must select the bus, not the block.
    {
      const found = new Map();
      for (const nm of sch.names) {
        if (!nm) continue;
        const mm = /^([A-Za-z]+)(\d{1,2})$/.exec(nm);
        if (!mm || /^not/i.test(mm[1])) continue;

      // --- the timing chain as cells ------------------------------------------------
      // The rule re-derived here from schematic.json and timing.json's stages,
      // independently of chain-cells.js: walk back from each output through
      // gate inputs and switch channels inside the chain's three blocks,
      // stopping at a node that reads anything from outside; owner by fewest
      // steps, ties shared, plus anything three or more stages read; a cell is
      // the connected own nodes. Then the structure the rule is supposed to
      // find, pinned by name: the same five-node cell for T3..T5, the cclk
      // half-latch in each, each reading the previous stage's latch, and the
      // ready and reset in the shared set. And the claim the card makes, that a
      // cell is active when its output is LOW, against the harness chip's own
      // T-state readout.
      {
        const timing = await fetch('timing.json').then((r) => r.json());
        const homeB = new Set(['Timing chain', 'Control pipeline', 'Static logic'].map((x) => sch.blockNames.indexOf(x)));
        const blkOf = (n) => sch.nodeBlock[n] & 0x7f;
        const backH = new Map(); const addH = (a, b) => { if (!backH.has(a)) backH.set(a, new Set()); backH.get(a).add(b); };
        for (const g of sch.gates) for (const i of new Set(g[3].flat())) addH(g[0], i);
        for (const [, a, b] of sch.switches) { addH(a, b); addH(b, a); }
        const nbH = (n) => backH.get(n) || new Set();
        const outsH = timing.stages.map((x) => x.node);
        const reachH = outsH.map((o) => {
          const dd = new Map([[o, 0]]); const q = [o];
          while (q.length) {
            const n = q.shift(); const dn = dd.get(n);
            if (dn >= 40) continue;
            if (n !== o && [...nbH(n)].some((x) => !rails.has(x) && !homeB.has(blkOf(x)))) continue;
            for (const x of nbH(n)) { if (rails.has(x) || dd.has(x)) continue; dd.set(x, dn + 1); if (homeB.has(blkOf(x))) q.push(x); }
          }
          return dd;
        });
        const ownerH = new Map(); const allH = new Set(); reachH.forEach((r) => r.forEach((_, n) => allH.add(n)));
        for (const n of allH) { const hits = reachH.map((r, i) => [i, r.get(n)]).filter(([, v]) => v !== undefined); const md = Math.min(...hits.map((h) => h[1])); const best = hits.filter((h) => h[1] === md); ownerH.set(n, best.length > 1 ? -1 : best[0][0]); }
        const readByH = new Map();
        for (const g of sch.gates) { const o = ownerH.get(g[0]); if (o === undefined || o < 0) continue; for (const i of new Set(g[3].flat())) { if (!readByH.has(i)) readByH.set(i, new Set()); readByH.get(i).add(o); } }
        for (const [n, ss] of readByH) if (ss.size >= 3 && ownerH.has(n)) ownerH.set(n, -1);
        const cellsH = outsH.map((o, i) => { const c = new Set([o]); const q = [o]; while (q.length) { const n = q.shift(); for (const x of nbH(n)) if (ownerH.get(x) === i && !c.has(x) && homeB.has(blkOf(x))) { c.add(x); q.push(x); } } return [...c].filter((n) => mine.has(n)).sort((a, b) => a - b); });
        const sharedH = new Set(); for (const c of cellsH) for (const n of c) for (const x of nbH(n)) if (ownerH.get(x) === -1) sharedH.add(x);
        const gotChain = T.chainList();
        const cellById = (id) => gotChain.find((c) => c.id === id);
        ok('the chain cells are the harness\'s own, node for node, six cells and the shared set',
           gotChain.length === 7 && cellsH.every((c, i) => cellById(`T${i}`)?.nodes.join() === c.join())
           && cellById('shared').nodes.join() === [...sharedH].filter((n) => mine.has(n)).sort((a, b) => a - b).join(),
           gotChain.map((c) => `${c.id}:${c.nodes.length}`).join(' '));
        const nmOf = (n) => sch.names[n] || `#${n}`;
        const namesOf = (id) => cellById(id).nodes.map(nmOf);
        ok('T3, T4 and T5 are the same five-node cell, each holding its own cclk half-latch',
           ['T3', 'T4', 'T5'].every((id) => cellById(id).nodes.length === 5 && namesOf(id).includes(`pipe${id}out`) && namesOf(id).includes(id.toLowerCase())),
           ['T3', 'T4', 'T5'].map((id) => `${id}: ${namesOf(id).join(' ')}`).join(' | '));
        ok('and each reads the previous stage\'s latch, which is the shift register read off the wires',
           [3, 4, 5].every((i) => cellById(`T${i}`).reads.some((r) => r.cell === i - 1 && sch.names[r.of] === `pipeT${i - 1}out`)),
           [3, 4, 5].map((i) => cellById(`T${i}`).reads.map((r) => `${nmOf(r.node)}<-${nmOf(r.of)}[T${r.cell}]`).join(',')).join(' | '));
        ok('the shared set is the ready and the reset', namesOf('shared').includes('notRdy0') && namesOf('shared').length === 4, namesOf('shared').join(' '));
        ok('T2 holds the SYNC latch it loads from, and T0 is the largest cell', namesOf('T2').includes('pipeT-SYNC') && cellById('T0').nodes.length > cellById('T2').nodes.length, `T2 ${namesOf('T2').join(' ')}; T0 ${cellById('T0').nodes.length}`);
        // Active low, against the harness chip at the same half-cycle: the
        // readout names a state exactly when that cell's output is low.
        runTo(41);
        const activeH = m.timingStates().split('+');
        const lowOk = timing.stages.every((x, i) => activeH.includes(`T${i}`) === !m.isNodeHigh(x.node));
        ok(`the readout (${m.timingStates()}) names a state exactly when its output is low on the harness chip`, lowOk && activeH.length >= 1);
        const hpath = (id) => d.querySelector(`#tc-chain-regions .tc-hg[data-chain="${id}"]`);
        let outH = 0; for (const c of gotChain) for (const n of c.nodes) { const p = mine.get(n); if (!hit2(hpath(c.id), p.x, p.y)) outH++; }
        ok('every cell node lies inside its cell\'s beads', outH === 0, `${outH} outside`);
        let activeSeen = 0, cardOk = 0;
        for (const x of timing.stages.map((_, i) => `T${i}`)) {
          T.selectChain(x);
          const txt = $('tc-block').textContent;
          const isActive = activeH.includes(x);

        T.selectChain('T3');

        const t3Set = new Set(cellById('T3').nodes);

        // A click on a bead: a point inside T4's bead and no control outline,

          const p = mine.get(n);

        T.frameNodes([hspot.n]);
        f.style.height = '2600px'; await sleep(100);
        const tgH = click2(hspot.x, hspot.y);
        ok('the click lands on a chain bead', tgH.classList.contains('tc-hg'), tgH.tagName + '.' + tgH.className.baseVal);
        ok('and selects T4, clearing every other kind', st.chain === 'T4' && st.block === null && st.stem === null && st.stage === null && st.cluster === null, `${st.chain}`);
        click2(hspot.x, hspot.y);
        ok('clicking the selected bead again clears it', st.chain === null);
        T.selectChain('T2'); T.selectStage('T2');
        ok('a stage clears a chain cell, and a chain cell a stage', st.chain === null && st.stage === 'T2' && (T.selectChain('T2'), st.stage === null && st.chain === 'T2'));
        T.setCollapsed('chain:T3', true);
        const snH = d.querySelector('#tc-supers .tc-sn[data-key="chain:T3"]');
        const t3n = cellById('T3').nodes;
        let hx = 0, hy = 0; for (const n of t3n) { const p = mine.get(n); hx += p.x; hy += p.y; }
        ok('T3 collapses into one node at its mean, five members', !!snH && Math.abs(Number(snH.getAttribute('cx')) - hx / t3n.length) < 0.6 && Math.abs(Number(snH.getAttribute('cy')) - hy / t3n.length) < 0.6 && d.querySelector('.tc-sn-lb[data-key="chain:T3"]').textContent === 'chain T3 · 5');

      // --- collapsing a container into one node ------------------------------------
      {
        const aluB = sch.blockNames.indexOf('ALU');
        const aluDrawn = circles().filter((c) => (sch.nodeBlock[Number(c.dataset.node)] & 0x7f) === aluB).map((c) => Number(c.dataset.node));
        T.selectBlock(aluB);

        const supers = () => [...d.querySelectorAll('#tc-supers .tc-sn')];
        ok('one collapsed node appears', supers().length === 1 && supers()[0].dataset.key === `block:${aluB}`);

        let mx = 0, my = 0; for (const n of aluDrawn) { const p = mine.get(n); mx += p.x; my += p.y; }

    ok('the watched bits are ringed in the drawing and labelled at any zoom',
       [...Array(8).keys()].every((b) => st.nodeEl.get(byName.get(`abl${b}`))?.classList.contains('wt')

       && d.querySelectorAll('#tc-svg .tc-bus').length === 2, `${d.querySelectorAll('#tc-svg .tc-bus').length} bus lines`);
    // Registers and the code.
    ok('the register cards read the harness chip', $('tc-regs').querySelector('[data-reg="pc"] .tc-reg-v').textContent === `$${hex4(m.pc())}`
       && $('tc-regs').querySelector('[data-reg="a"] .tc-reg-v').textContent === `$${hex2(m.a())}`);
    const cur = d.querySelector('#tc-code .tc-row.cur');
    ok('the code marks the instruction being fetched', !!cur && Number(cur.dataset.addr) === m.lastFetchAddr(), cur ? `$${hex4(Number(cur.dataset.addr))} vs $${hex4(m.lastFetchAddr())}` : 'no current row');
    // Only what moved: what is visible is exactly rings, last rings and the watch.
    const shown = circles().filter((c) => w.getComputedStyle(c).display !== 'none').length;
    const wantShown = circles().filter((c) => ['chg', 'was', 'wt', 'on-pick'].some((k) => c.classList.contains(k))).length;
    ok('"only what moved" hides every node that is not ringed, was not ringed, or watched', shown === wantShown && shown < circles().length / 2, `${shown} of ${circles().length} shown`);
    // The moved list matches the change set.
    const pills = [...d.querySelectorAll('#tc-moved .tc-node[data-node]')].map((b) => Number(b.dataset.node));
    const unnamedCount = [...d.querySelectorAll('#tc-moved .tc-unnamed')].reduce((s, e) => s + parseInt(e.textContent, 10), 0);
    ok('the moved list is the change set: every named node as a pill, the unnamed as counts',
       pills.length + unnamedCount === chg41.length && pills.every((n) => chgSet.has(n) && sch.names[n]), `${pills.length} pills + ${unnamedCount} unnamed = ${chg41.length}`);

    // --- stepping ------------------------------------------------------------------
    T.setOnly(false);
    const before = vb();
    d.querySelector('#tc-moved .tc-node[data-node]').click();
    await sleep(100);
    ok('clicking a name in the list picks it and flies to it', st.picked === pills[0] && $('tc-picked').textContent.includes(sch.names[pills[0]]) && vb().join() !== before.join(), $('tc-picked').textContent.slice(0, 60));
    $('tc-step').click();
    await sleep(50);
    const [L41b, L42] = pair(42);
    const chg42 = changedBetween(L41b, L42);
    const ringed42 = circles().filter((c) => c.classList.contains('chg')).map((c) => Number(c.dataset.node)).sort((a, b) => a - b);
    ok('½ cycle steps once and re-marks: the rings are the new change set, without a frame',
       st.m.halfCycle() === 42 && ringed42.join() === chg42.filter((n) => drawn.has(n)).sort((a, b) => a - b).join(), `${ringed42.length} ringed at 42`);
    const wasSet = circles().filter((c) => c.classList.contains('was')).map((c) => Number(c.dataset.node));
    ok('and the previous half-cycle\'s nodes keep a fainter ring',
       wasSet.length > 0 && wasSet.every((n) => chgSet.has(n) && !chg42.includes(n)), `${wasSet.length} faint`);
    $('tc-back').click();
    await sleep(50);
    ok('Back rewinds one half-cycle', st.m.halfCycle() === 41 && /half-cycle 41\b/.test($('tc-head').textContent));
    $('tc-cycle').click();
    await sleep(50);
    ok('Cycle steps two, and says two half-cycles passed since the last frame', st.m.halfCycle() === 43 && /2 half-cycles since/.test($('tc-head').textContent), $('tc-head').textContent.slice(-60));
    // Run through a fetch and see the count on the code go up.
    const countOf = (addr) => Number(d.querySelector(`#tc-code .tc-row[data-addr="${addr}"] .tc-c-n`)?.textContent || 0);
    const firstAddr = Number(d.querySelector('#tc-code .tc-row[data-addr]').dataset.addr);
    const c0 = countOf(firstAddr);
    T.advance(60); T.paint();
    // Counted at every clock: the harness chip agrees on how many fetches of
    // each address there were between reset and now, which a listing counting
    // only at slow clocks could not.
    const mm = new Machine(); mm.load(LOAD_ADDR, new Uint8Array(prog.bytes)); mm.setResetVector(LOAD_ADDR); mm.powerCycle();
    const wantFetches = new Map();
    let lastSeen = -1;
    for (let hh = 0; hh <= st.m.halfCycle(); hh++) {
      if (hh) mm.halfStep();
      if (mm.sync() && !mm.clk0() && mm.halfCycle() !== lastSeen) { lastSeen = mm.halfCycle(); wantFetches.set(mm.lastFetchAddr(), (wantFetches.get(mm.lastFetchAddr()) || 0) + 1); }
    }
    const disagree = [...wantFetches].filter(([a, n]) => countOf(a) !== n);
    ok('fetches are counted on the listing as the chip runs through them, at any clock, from the first',
       disagree.length === 0 && wantFetches.size > 3 && countOf(firstAddr) === 1
       && [...wantFetches.values()].some((n) => n > 1),
       `${wantFetches.size} addresses, ${disagree.length} disagree; first instruction ${countOf(firstAddr)}`);
    void c0;
    // Keyboard.
    const h0 = st.m.halfCycle();
    d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
    await sleep(50);
    ok('the right arrow steps', st.m.halfCycle() === h0 + 1);

    // --- the watch and the views ---------------------------------------------------
    d.querySelector('[data-preset="address"]').click();
    await sleep(50);
    ok('a preset replaces the watch and redraws the bus lines',
       $('tc-watch-input').value === 'abh abl adh adl pch pcl' && d.querySelectorAll('#tc-svg .tc-bus').length === 6
       && d.querySelectorAll('#tc-watch .tc-w').length === 6, $('tc-watch-input').value);
    d.querySelector('[data-mode="named"]').click();
    await sleep(600);
    ok('named signals only draws no unnamed node, and the marks are recomputed',
       circles().every((c) => !!sch.names[Number(c.dataset.node)]) && circles().length < 900
       && circles().filter((c) => c.classList.contains('hi')).length > 0, `${circles().length} nodes`);
    d.querySelector('[data-mode="full"]').click();
    await sleep(800);
    ok('and back to every node', circles().length === drawn.size);
    // Zoom labels.
    $('tc-in').click(); $('tc-in').click(); $('tc-in').click();
    await sleep(50);
    ok('zooming past the threshold shows every named label', $('tc-cam').classList.contains('z-labels') && st.home[2] / vb()[2] >= 3, `${(st.home[2] / vb()[2]).toFixed(1)}x`);
    $('tc-home').click();
    ok('Fit goes home', vb().join() === st.home.join());

    // --- the camera: pan, pinch, and a tap is not a drag ---------------------------
    // Driven through the real handlers with synthetic pointer events: down on
    // the stage, move and up on the window, which is where the page listens.
    // The assertion that matters is not "the scale went up" -- the explorer's
    // pinch bug left the scale right and the anchor at (0,0) -- but that the
    // die point under the fingers is still under the fingers afterwards.
    const stage = d.querySelector('.tc-stage');
    const dieAt = (cx, cy) => {
      const r = $('tc-svg').getBoundingClientRect(); const [x, y, w, hh] = vb();
      return { x: x + ((cx - r.left) / r.width) * w, y: y + ((cy - r.top) / r.height) * hh };
    };
    const ptr = (type, id, x, y, target, pointerType = 'touch') =>
      target.dispatchEvent(new w.PointerEvent(type, { bubbles: true, pointerId: id, pointerType, clientX: x, clientY: y, isPrimary: id === 1 }));
    const sr0 = $('tc-svg').getBoundingClientRect();
    const mx = sr0.left + sr0.width * 0.4, my = sr0.top + sr0.height * 0.45;
    // Pan with one finger: the die moves with it.
    const under0 = dieAt(mx, my);
    ptr('pointerdown', 1, mx, my, stage);
    ptr('pointermove', 1, mx + 90, my + 60, w);
    ptr('pointerup', 1, mx + 90, my + 60, w);
    const under1 = dieAt(mx + 90, my + 60);
    ok('one finger pans: the die point that was under it is still under it 90px later',
       Math.hypot(under1.x - under0.x, under1.y - under0.y) < 1 && vb()[2] === st.home[2] && st.dragged === true,
       `${under0.x.toFixed(0)},${under0.y.toFixed(0)} -> ${under1.x.toFixed(0)},${under1.y.toFixed(0)}`);
    // Pinch with two: spread doubles about a fixed midpoint, the view width halves,
    // and the die point under the midpoint does not move.
    const w0 = vb()[2];
    const ax = mx - 50, bx = mx + 50;
    const mid0 = dieAt(mx, my);
    ptr('pointerdown', 1, ax, my, stage);
    ptr('pointerdown', 2, bx, my, stage);
    ptr('pointermove', 1, mx - 100, my, w);
    ptr('pointermove', 2, mx + 100, my, w);
    const mid1 = dieAt(mx, my);
    ok('two fingers pinch: doubling the spread halves the view, about the midpoint',
       Math.abs(vb()[2] / w0 - 0.5) < 0.01 && Math.hypot(mid1.x - mid0.x, mid1.y - mid0.y) < 1 && vb().every(Number.isFinite),
       `${(w0 / vb()[2]).toFixed(2)}x, midpoint drift ${Math.hypot(mid1.x - mid0.x, mid1.y - mid0.y).toFixed(1)}`);
    // One finger lifts: the other pans from where it is, with no jump.
    ptr('pointerup', 2, mx + 100, my, w);
    const held = dieAt(mx - 100, my);
    ptr('pointermove', 1, mx - 60, my + 30, w);
    const heldAfter = dieAt(mx - 60, my + 30);
    ptr('pointerup', 1, mx - 60, my + 30, w);
    ok('lifting one finger leaves the other panning from where it is',
       Math.hypot(heldAfter.x - held.x, heldAfter.y - held.y) < 1 && Math.abs(vb()[2] / w0 - 0.5) < 0.01,
       `drift ${Math.hypot(heldAfter.x - held.x, heldAfter.y - held.y).toFixed(1)}`);
    // Verified to be able to tell: with the page's pinch anchored at (0,0) instead
    // of the fingers (the explorer's old bug), the scale above still reads 2.00x
    // and the midpoint drifts by about a view-width (8025 units), and only the
    // midpoint clause goes red.
    // A tap on a node picks it; a press that travelled more than the touch slop
    // does not.
    const someNode = [...st.nodeEl.entries()].find(([n, c]) => c.getBoundingClientRect().width > 0 && n !== sch.vss);
    const nc = someNode[1].getBoundingClientRect();
    ptr('pointerdown', 1, nc.left + nc.width / 2, nc.top + nc.height / 2, stage);
    ptr('pointermove', 1, nc.left + nc.width / 2 + 5, nc.top + nc.height / 2 + 5, w);
    ptr('pointerup', 1, nc.left + nc.width / 2 + 5, nc.top + nc.height / 2 + 5, w);
    someNode[1].dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
    ok('a touch that moved 7px is a tap, and picks the node', st.picked === someNode[0] && st.dragged === false, `picked ${st.picked}`);
    ptr('pointerdown', 1, nc.left + nc.width / 2, nc.top + nc.height / 2, stage);
    ptr('pointermove', 1, nc.left + nc.width / 2 + 40, nc.top + nc.height / 2, w);
    ptr('pointerup', 1, nc.left + nc.width / 2 + 40, nc.top + nc.height / 2, w);
    T.pick(null);
    someNode[1].dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
    ok('a touch that moved 40px is a drag, and its click picks nothing', st.picked === null && st.dragged === true);
    $('tc-home').click();

    // --- reset and program change --------------------------------------------------
    $('tc-reset').click();
    await sleep(50);
    ok('Reset power-cycles: half-cycle 0, no change set, and the listing forgets its counts',
       st.m.halfCycle() === 0 && st.changed.length === 0 && /Power-on state/.test($('tc-moved-sum').textContent) && st.fetches.size === 1);
    T.state.choose(0);
    await sleep(50);
    ok('choosing a program reloads and the header agrees', $('tc-code').textContent.includes(PROGRAMS[0].name) && d.querySelector('.nav-prog select').value === '0');

    // --- fullscreen: the study view --------------------------------------------------
    // The native API needs a user activation a harness cannot give, so the
    // fallback is forced (the spy goes on the element: an own property shadows
    // the prototype) and the mode is driven through the real button. The saved
    // console configuration is a hidden input to everything below, so it is
    // cleared and the palette put back to its defaults first.
    const con = d.querySelector('#bench .console');
    con.requestFullscreen = undefined;
    con.webkitRequestFullscreen = undefined;
    localStorage.removeItem(T.CFG_KEY);
    const pal = T.palette();
    pal.restore({ tab: 'regs', drawer: true });
    const vis = (el) => !!el && w.getComputedStyle(el).display !== 'none';
    const stageH0 = $('tc-svg').getBoundingClientRect().height;
    $('tc-fullscreen').click();
    await sleep(400);
    const r = con.getBoundingClientRect();
    ok('the fullscreen button covers the viewport with the console (fallback path)',
       con.classList.contains('immersive') && con.classList.contains('faux') && con.classList.contains('solo') && d.body.classList.contains('no-scroll')
       && Math.abs(r.width - w.innerWidth) < 2 && Math.abs(r.height - w.innerHeight) < 2, `${r.width}x${r.height} of ${w.innerWidth}x${w.innerHeight}`);
    const sr = $('tc-svg').getBoundingClientRect();
    ok('and the drawing takes the whole of it', sr.height > stageH0 && sr.height > w.innerHeight * 0.9 && sr.width > w.innerWidth * 0.95,
       `${stageH0.toFixed(0)} -> ${sr.width.toFixed(0)}x${sr.height.toFixed(0)} of ${w.innerWidth}x${w.innerHeight}`);
    const palEl = $('tc-palette');
    ok('the side column is gone and the floating console is on the stage',
       !vis(d.querySelector('.tc-side')) && vis(palEl) && vis($('tc-strip')) && palEl.dataset.drawer === 'open' && palEl.dataset.open === 'regs',
       `${palEl.dataset.drawer}/${palEl.dataset.open}`);
    const pr0 = palEl.getBoundingClientRect();
    ok('and it sits inside the stage', pr0.left >= sr.left - 1 && pr0.top >= sr.top - 1 && pr0.right <= sr.right + 1 && pr0.bottom <= sr.bottom + 1,
       `${pr0.left.toFixed(0)},${pr0.top.toFixed(0)} ${pr0.width.toFixed(0)}x${pr0.height.toFixed(0)}`);
    ok('the Registers drawer holds the side column\'s own register cards, borrowed',
       $('tc-regs').closest('#tc-sp-panel') === $('tc-sp-panel') && $('tc-head').closest('#tc-sp-panel') === $('tc-sp-panel') && d.querySelectorAll('.tc-reg').length === 8);
    // A step from the strip moves the chip, and the borrowed cards still paint.
    const hBefore = st.m.halfCycle();
    const pcBefore = $('tc-regs').querySelector('[data-reg="pc"] .tc-reg-v').textContent;
    $('tc-solo-cycle').click();
    await sleep(50);
    ok('the strip\'s transport drives the chip and the drawer head reads it',
       st.m.halfCycle() === hBefore + 2 && $('tc-solo-clock').textContent.startsWith(`½cyc ${hBefore + 2}`), $('tc-solo-clock').textContent);
    for (let i = 0; i < 8 && $('tc-regs').querySelector('[data-reg="pc"] .tc-reg-v').textContent === pcBefore; i++) { $('tc-solo-step').click(); }
    ok('and the borrowed register card repainted in place',
       $('tc-regs').querySelector('[data-reg="pc"] .tc-reg-v').textContent !== pcBefore, `${pcBefore} -> ${$('tc-regs').querySelector('[data-reg="pc"] .tc-reg-v').textContent}`);
    // Switch drawers: the registers go home and the listing comes in.
    d.querySelector('#tc-strip [data-tab="code"]').click();
    await sleep(50);
    ok('opening Code returns the registers to the side column and borrows the listing',
       palEl.dataset.open === 'code' && $('tc-code').parentNode === $('tc-sp-panel') && $('tc-regs').parentNode === d.querySelector('.tc-side')
       && $('tc-regs').previousElementSibling === d.querySelector('.tc-transport'), '');
    ok('the current line is still marked in the borrowed listing', !!$('tc-code').querySelector('.tc-row.cur'));
    d.querySelector('#tc-strip [data-tab="moved"]').click();
    await sleep(50);
    ok('Moved borrows the summary and the list, in that order',
       $('tc-moved-sum').parentNode === $('tc-sp-panel') && $('tc-moved-sum').nextElementSibling === $('tc-moved')
       && $('tc-code').parentNode === d.querySelector('.tc-side') && $('tc-code').nextElementSibling === d.querySelector('.tc-moved-wrap'), '');
    d.querySelector('#tc-strip [data-tab="view"]').click();
    await sleep(50);
    ok('View borrows the mode group, the zoom and the picked node',
       $('tc-modes').parentNode === $('tc-sp-panel') && $('tc-zoomctl').parentNode === $('tc-sp-panel') && $('tc-picked').closest('#tc-sp-panel') === $('tc-sp-panel'));
    $('tc-in').click();
    ok('and the zoom buttons still work from there', st.home[2] / vb()[2] > 1.5, `${(st.home[2] / vb()[2]).toFixed(1)}x`);
    $('tc-solo-fit').click();
    ok('the drawer head\'s fit goes home', vb().join() === st.home.join());
    // Pressing the open icon shuts the drawer; p opens it again.
    d.querySelector('#tc-strip [data-tab="view"]').click();
    await sleep(50);
    ok('pressing the open drawer\'s icon shuts it, leaving the strip',
       palEl.dataset.drawer === 'shut' && !vis($('tc-drawer')) && vis($('tc-strip')));
    d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'p', bubbles: true }));
    await sleep(50);
    ok('p opens it again, on the same tab', palEl.dataset.drawer === 'open' && palEl.dataset.open === 'view' && vis($('tc-drawer')));
    // Drag the console by its strip. Move and release are watched on the
    // window, and a press that became a drag must not fire the button under it.
    const stripR = $('tc-strip').getBoundingClientRect();
    const exitBtn = $('tc-solo-exit');
    const er = exitBtn.getBoundingClientRect();
    const p0 = palEl.getBoundingClientRect();
    const pe = (type, x, y, target) => target.dispatchEvent(new w.PointerEvent(type, { bubbles: true, clientX: x, clientY: y, pointerId: 1, pointerType: 'mouse' }));
    pe('pointerdown', er.left + er.width / 2, er.top + er.height / 2, exitBtn);
    // Up and to the right, where there is room: the default position is the
    // bottom-left corner, and a drag into the clamp would measure the clamp.
    pe('pointermove', er.left + er.width / 2 + 60, er.top + er.height / 2 - 100, w);
    pe('pointermove', er.left + er.width / 2 + 120, er.top + er.height / 2 - 200, w);
    pe('pointerup', er.left + er.width / 2 + 120, er.top + er.height / 2 - 200, w);
    exitBtn.dispatchEvent(new w.MouseEvent('click', { bubbles: true, clientX: er.left + 120, clientY: er.top - 200 }));
    await sleep(50);
    const p1 = palEl.getBoundingClientRect();
    ok('dragging the strip moves the console, and a drag that started on the exit icon does not leave',
       Math.abs((p1.left - p0.left) - 120) < 2 && Math.abs((p1.top - p0.top) + 200) < 2 && con.classList.contains('immersive'),
       `moved ${(p1.left - p0.left).toFixed(0)},${(p1.top - p0.top).toFixed(0)}`);
    pal.place(99999, 99999);
    const p2 = palEl.getBoundingClientRect();
    ok('and it is clamped inside the stage', p2.right <= sr.right + 1 && p2.bottom <= sr.bottom + 1 && p2.left > sr.left + 10,
       `${p2.left.toFixed(0)},${p2.top.toFixed(0)} in ${sr.width.toFixed(0)}x${sr.height.toFixed(0)}`);
    const savedCfg = JSON.parse(localStorage.getItem(T.CFG_KEY) || 'null');
    ok('the console configuration is written down: position, drawer and tab',
       !!savedCfg && savedCfg.tab === 'view' && savedCfg.drawer === true && savedCfg.pos && Math.abs(savedCfg.pos.x - (p2.left - sr.left)) < 2,
       JSON.stringify(savedCfg));
    d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await sleep(100);
    ok('Escape leaves fullscreen, the console goes, and everything borrowed is back where it was',
       !con.classList.contains('immersive') && !con.classList.contains('solo') && !d.body.classList.contains('no-scroll') && !vis(palEl)
       && $('tc-modes').parentNode === d.querySelector('.tc-controls .field') && $('tc-zoomctl').parentNode === d.querySelector('.console-bar')
       && $('tc-picked').closest('.tc-controls') !== null && vis(d.querySelector('.tc-side')), '');
    // Coming back finds the same tab open: the saved configuration wins.
    $('tc-fullscreen').click();
    await sleep(300);
    ok('entering again opens the same drawer the reader left', palEl.dataset.open === 'view' && palEl.dataset.drawer === 'open' && $('tc-modes').parentNode === $('tc-sp-panel'));
    $('tc-solo-exit').click();
    await sleep(100);
    ok('the strip\'s exit leaves', !con.classList.contains('immersive') && $('tc-modes').parentNode !== $('tc-sp-panel'));
    localStorage.removeItem(T.CFG_KEY);

    // --- prose and shell -----------------------------------------------------------
    const stray = [];
    for (const p of d.querySelectorAll('.bp-prose p')) {
      const clone = p.cloneNode(true);
      for (const kill of clone.querySelectorAll('[data-fact], .mono, code, a')) kill.remove();
      const mm = clone.textContent.replace(/\b65C?[0-9]{2,3}\b/gi, '').match(/\b\d[\d,]*\b/g);
      if (mm) stray.push(`${mm.join('/')} in "${clone.textContent.trim().slice(0, 40)}"`);
    }
    ok('no measurement was typed into the prose', stray.length === 0, stray.slice(0, 3).join(' | '));
    for (let i = 0; i < 100 && !d.querySelector('#site-nav a'); i++) await sleep(50);
    ok('the menu marks this page as the current one', d.querySelectorAll('#site-nav a[aria-current="page"]').length === 1);
    ok('the footer is the site footer, all four elements',
       !!d.querySelector('footer.site-foot .wrap .mark') && !!d.querySelector('footer.site-foot .wrap .foot-meta')
       && !!d.querySelector('footer.site-foot span.version-foot[data-version-footer]'), '');
    ok('no em dash in the rendered page', !d.querySelector('main').textContent.includes('—'), '');
    // Last, because it moves the chip: a step keeps the block selection and
    // the card's moved count follows.
    {
      const b = T.soloBlock;
      T.selectBlock(b);
      T.stepOnce();
      const movedAfter = st.changed.filter((n) => (sch.nodeBlock[n] & 0x7f) === b).length;
      ok('a step keeps the block selection and the card\'s moved count follows the chip', st.block === b && $('tc-block').textContent.includes(`${movedAfter} moved`), $('tc-block').textContent);
      T.setCollapsed(`block:${b}`, true);
      const snB = d.querySelector(`#tc-supers .tc-sn[data-key="block:${b}"]`);
      T.stepOnce();
      const movedNow = st.changed.filter((n) => (sch.nodeBlock[n] & 0x7f) === b).length;
      ok('a step repaints a collapsed node: its moved count is the chip\'s', Number(snB.dataset.moved) === movedNow && snB.classList.contains('chg') === (movedNow > 0), `${snB.dataset.moved} vs ${movedNow}`);
      T.setCollapsed(`block:${b}`, false);
      T.selectBlock(null);
    }
  } catch (e) {
    ok('the harness ran to the end', false, e && e.stack ? e.stack.split('\n').slice(0, 2).join(' ') : String(e));
  }

  const bad = results.filter((r) => r.startsWith('FAIL'));
  document.title = bad.length ? `${bad.length} FAIL` : 'ALL PASS';
  const pre = document.createElement('pre');
  pre.textContent = results.join('\n');
  document.body.appendChild(pre);
}, { once: true });
</script>
</body></html>
