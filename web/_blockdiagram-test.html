<!doctype html>
<!--
  Development harness, never shipped: build-web.py copies only the files it
  names, so nothing here reaches dist/.

  This page encodes a published figure as a dataset and answers it from the
  measurements. So the harness re-resolves every block STRAIGHT OUT OF
  schematic.json with its own code rather than importing blockdiagram.js: a
  harness that called the page's own resolver would be asking the page whether
  the page is right.

  The load-bearing assertion is the same one the talk and designer pages have:
  exactly one row differs, and it is the single-internal-bus row. An all-green
  table is what a comparison that silently throws produces, and this page's
  whole reason for existing is the one claim that does not survive.

    http://localhost:8777/_blockdiagram-test.html
-->
<html lang="en"><head><meta charset="utf-8"><title>pending</title>
<style>body{margin:0;background:#0b1120;color:#eaf2ff;font:12px ui-monospace,monospace}
iframe{width:1200px;height:800px;border:0}pre{padding:1rem;white-space:pre-wrap}</style>
</head><body>
<iframe id="f" src="blockdiagram.html"></iframe>
<script type="module">
const results = [];
const ok = (n, c, d) => results.push(`${c ? 'PASS' : 'FAIL'} ${n}${d ? ' :: ' + d : ''}`);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.getElementById('f');

f.addEventListener('load', async () => {
  const d = f.contentDocument;
  const $ = (id) => d.getElementById(id);
  try {
    for (let i = 0; i < 250 && $('bd-main').hidden; i++) await sleep(50);
    ok('the page booted', !$('bd-main').hidden, $('bd-status').textContent);

    const [sch, blk, bp] = await Promise.all(
      ['schematic.json', 'blocks.json', 'blueprint.json']
        .map((x) => fetch(x).then((r) => r.json())));

    // This harness's own index of `stem0..stemN`, built from the names table.
    const bits = new Map();
    sch.names.forEach((n, i) => {
      if (!n) return;
      const m = /^(.*?)(\d+)$/.exec(n);
      if (!m || !m[1]) return;
      if (!bits.has(m[1])) bits.set(m[1], []);
      bits.get(m[1]).push(i);
    });

    // --- every slot filled ---------------------------------------------------
    const slots = [...d.querySelectorAll('[data-fact]')];
    const empty = slots.filter((s) => !s.textContent.trim() || s.textContent.trim() === '…');
    ok('every fact slot was filled', slots.length > 0 && empty.length === 0,
       `${slots.length} slots, ${empty.length} empty`);

    // --- the table is the measurement, row by row ---------------------------
    const rows = [...d.querySelectorAll('#bd-rows tr')].map((tr) => ({
      kind: tr.dataset.kind,
      section: tr.dataset.section,
      cells: [...tr.children].map((td) => td.textContent.trim()),
    }));
    ok('every block in the figure has a row', rows.length >= 25, `${rows.length} rows`);

    // Kind and section are different questions and this checks both. Grouping
    // by kind alone counted the address and data buses as datapath, because
    // they are bus-shaped claims -- so the assertion said "14 datapath" for a
    // figure with 12, which was the label lying rather than the page.
    const bitRows = rows.filter((r) => r.kind === 'bits');
    const regionRows = rows.filter((r) => r.kind === 'region');
    const sec = (n) => rows.filter((r) => r.section === n);
    ok('the figure has all three sections',
       sec('datapath').length === 12 && sec('control').length === 5
       && sec('pins').length === 8,
       `${sec('datapath').length} datapath, ${sec('control').length} control, `
       + `${sec('pins').length} pins`);

    // --- the figure is a family portrait -------------------------------------
    //
    // These are the assertions that caught the page claiming things the plate
    // does not draw. It was built from a second-hand tracing and had invented a
    // "control pipeline" box while missing the clock generator; reading the
    // actual figure fixed it. They pin both directions of the mismatch.
    const missing = [...d.querySelectorAll('#bd-svg .bd-missing')];
    ok('a pin the figure draws is absent here, and is marked rather than dropped',
       missing.length === 1 && rows.some((r) => /data bus enable/i.test(r.cells[0])),
       `${missing.length} marked missing`);
    ok('and data bus enable really is absent from the netlist',
       !sch.names.includes('dbe'),
       sch.names.includes('dbe') ? 'dbe IS on the die' : 'no dbe in 1725 nodes');
    const dieOnly = [...d.querySelectorAll('#bd-svg .bd-extra')];
    ok('things this die has that the figure does not draw are marked too',
       dieOnly.length >= 2, `${dieOnly.length} marked`);
    ok('and set overflow and sync are among them',
       ['so', 'sync'].every((n) => sch.names.includes(n)),
       'so/sync on the die');
    ok('the clock generator resolves to signals but to no single region',
       rows.some((r) => r.kind === 'clocks' && /no region|spread across/.test(r.cells[2])),
       rows.find((r) => r.kind === 'clocks')?.cells.join(' / ') || 'no clock row');

    const wrong = [];
    for (const { cells: [label, stem, size] } of bitRows) {
      const mine = bits.get(stem);
      if (!mine) { wrong.push(`${label}: ${stem} is not a stem here`); continue; }
      if (`${mine.length} wires` !== size) {
        wrong.push(`${label}: page says "${size}", netlist says ${mine.length}`);
      }
    }
    ok('and every datapath width is the one in the netlist', wrong.length === 0,
       wrong.slice(0, 3).join(' | ') || `${bitRows.length} checked`);

    // The control rows are measured against blocks.json, which this harness
    // reads for itself rather than taking the page's word for the sizes.
    const byName = new Map(blk.blocks.map((b) => [b.name, b]));
    const badRegion = [];
    for (const { cells: [label, region, size] } of regionRows) {
      const meta = byName.get(region);
      if (!meta) { badRegion.push(`${label}: no region "${region}"`); continue; }
      const want = `${meta.nodes} signals, ${meta.transistors} transistors`;
      if (want !== size) badRegion.push(`${label}: page says "${size}", blocks.json says "${want}"`);
    }
    ok('and every control region is the size blocks.json measured',
       badRegion.length === 0,
       badRegion.slice(0, 3).join(' | ') || `${regionRows.length} checked`);
    ok('decode and timing are both among them',
       regionRows.some((r) => /decode/i.test(r.cells[0]))
       && regionRows.some((r) => /timing/i.test(r.cells[0])),
       regionRows.map((r) => r.cells[0]).join(', '));

    // --- the data bus buffer, re-derived -------------------------------------
    //
    // The page's most interesting new claim, so this harness measures it again
    // with its own walk. The trap it is guarding is a real one: a walk that
    // follows only gate inputs finds NO route from a data pin to the internal
    // bus and would report a chip with no way to read memory, because the last
    // two steps are switches.
    const name2id = new Map(sch.names.map((n, i) => [n, i]).filter(([n]) => n));
    const dbn = new Set([...Array(8).keys()].map((i) => name2id.get(`db${i}`)));
    const idbn = new Set([...Array(8).keys()].map((i) => name2id.get(`idb${i}`)));
    const idln = new Set([...Array(8).keys()].map((i) => name2id.get(`idl${i}`)));
    const myDrivers = sch.gates.filter((g) => dbn.has(g[0])).length;
    const myDirect = sch.switches.filter(([, a, c]) =>
      (dbn.has(a) && idbn.has(c)) || (dbn.has(c) && idbn.has(a))).length;

    const nbr = new Map();
    const add = (a, b) => { if (!nbr.has(a)) nbr.set(a, new Set()); nbr.get(a).add(b); };
    for (const [node, , pre, legs] of sch.gates) {
      for (const leg of legs) for (const i of leg) add(i, node);
      if (pre >= 0) add(pre, node);
    }
    for (const [, a, c] of sch.switches) { add(a, c); add(c, a); }
    const seen = new Map([[name2id.get('db0'), null]]);
    const q = [name2id.get('db0')];
    let end = null;
    while (q.length && end === null) {
      const n = q.shift();
      if (idbn.has(n)) { end = n; break; }
      for (const t of nbr.get(n) || []) {
        if (seen.has(t) || t === sch.vss || t === sch.vcc) continue;
        seen.set(t, n); q.push(t);
      }
    }
    const route = [];
    for (let c = end; c != null; c = seen.get(c)) route.push(c);
    const hops = route.length - 1;

    const bufRow = rows.find((r) => r.kind === 'buffer');
    ok('the data bus buffer row matches an independent walk',
       !!bufRow && bufRow.cells[2] === `${myDrivers} driver gates out, ${hops} steps in`,
       bufRow ? `page "${bufRow.cells[2]}", harness ${myDrivers}/${hops}` : 'no row');
    ok('nothing joins a data pin straight to the internal bus', myDirect === 0,
       `${myDirect} direct pass transistors`);
    ok('and the way in goes through the input data latch',
       route.some((n) => idln.has(n)),
       route.map((n) => sch.names[n] || `#${n}`).reverse().join(' -> '));

    // --- the pins ------------------------------------------------------------
    const pinRows = rows.filter((r) => r.section === 'pins');
    ok('the address and data buses are the widths the netlist has',
       pinRows.some((r) => r.cells[1] === 'ab' && r.cells[2] === '16 wires')
       && pinRows.some((r) => r.cells[1] === 'db' && r.cells[2] === '8 wires'),
       pinRows.map((r) => `${r.cells[1]}:${r.cells[2]}`).join(', '));
    const unnamed = pinRows.filter((r) => r.kind === 'pinset'
      && !/^(\d+) of \1 named$/.test(r.cells[2]));
    // Data bus enable is expected NOT to resolve: it is a 6501 pin. Everything
    // else must, so the exemption is named rather than the assertion loosened.
    const shouldResolve = unnamed.filter((r) => !/data bus enable/i.test(r.cells[0]));
    ok('and every pin group except the 6501 one is named on the die',
       shouldResolve.length === 0,
       shouldResolve.map((r) => `${r.cells[0]}: ${r.cells[2]}`).join(' | ')
         || `${unnamed.length} unresolved, all expected`);

    // The translation the page makes a point of: the figure's DL is idl here.
    ok('the input data latch resolved to this die\'s own name for it',
       rows.some((r) => /input data latch/i.test(r.cells[0]) && r.cells[1] === 'idl'),
       rows.find((r) => /input data latch/i.test(r.cells[0]))?.cells.join(' / ')
         || 'no such row');

    // --- the drawing contains what the table claims -------------------------
    const boxes = [...d.querySelectorAll('#bd-svg .bd-box')];
    ok('the drawing has a box per block', boxes.length === rows.length,
       `${boxes.length} boxes, ${rows.length} rows`);
    // The buses the published figure does not draw are marked, and there is at
    // least one: that marking is the finding, not decoration.
    const extra = [...d.querySelectorAll('#bd-svg .bd-rail-extra')];
    ok('a bus the figure does not draw is marked as such', extra.length >= 1,
       `${extra.length} marked`);

    // --- re-derive the bus claim independently ------------------------------
    const buses = bp.units.filter((u) => u.kind === 'bus').map((u) => u.name);
    ok('this die derives both an sb and an idb',
       ['sb', 'idb'].every((n) => buses.includes(n)), buses.join(', '));

    // --- the verdicts --------------------------------------------------------
    const cards = [...d.querySelectorAll('.claim')];
    ok('every claim rendered a card', cards.length >= 3, `${cards.length} cards`);
    const differs = cards.filter((c) => c.classList.contains('claim-differs'));
    ok('exactly one claim differs', differs.length === 1,
       differs.map((c) => c.querySelector('.claim-says').textContent.trim().slice(0, 40)).join(' | '));
    ok('and it is the single-internal-bus claim',
       differs.length === 1 && /single internal data bus/i.test(differs[0].textContent),
       differs[0] ? differs[0].querySelector('.claim-says').textContent.trim().slice(0, 60) : 'none');
    const agreed = cards.length - differs.length;
    ok('the tally matches the cards',
       $('bd-tally').textContent === `${agreed} of ${cards.length} agree`,
       $('bd-tally').textContent);

    // --- no number typed into the prose -------------------------------------
    const stray = [];
    for (const p of $('bd-main').querySelectorAll('p')) {
      if (p.closest('#bd-checks')) continue;
      const clone = p.cloneNode(true);
      for (const kill of clone.querySelectorAll('[data-fact], .mono, code, a')) kill.remove();
      const m = clone.textContent
        .replace(/\b65C?[0-9]{2,3}\b/gi, '')
        // Whitespace-tolerant: the licence sits at the end of a wrapped line,
        // so a literal "CC BY-NC-SA 3.0" does not match and its version number
        // reads as a stray measurement.
        .replace(/CC BY-NC-SA\s+3\.0/g, '')
        .replace(/\b(19|20)\d\d\b/g, '')
        .match(/\b\d[\d,]*\b/g);
      if (m) stray.push(`${m.join('/')} in "${clone.textContent.trim().slice(0, 40)}…"`);
    }
    ok('and no measurement was typed into the prose', stray.length === 0,
       stray.slice(0, 3).join(' | '));

    // --- it is part of the site ---------------------------------------------
    for (let i = 0; i < 100 && !d.querySelector('#site-nav a'); i++) await sleep(50);
    const current = [...d.querySelectorAll('#site-nav a[aria-current="page"]')];
    ok('the menu marks this page as the current one', current.length === 1,
       current.map((a) => a.textContent.trim().slice(0, 30)).join(', '));
    const groups = [...d.querySelectorAll('#site-nav .navgroup-title')].map((h) => h.textContent);
    ok('and it sits in its own Block diagram section',
       groups.includes('Block diagram'), groups.join(' | '));
    ok('the footer is the site footer, all four elements',
       !!d.querySelector('footer.site-foot .wrap .mark')
       && !!d.querySelector('footer.site-foot .wrap .foot-meta')
       && !!d.querySelector('footer.site-foot span.version-foot[data-version-footer]'), '');
    ok('no em dash in the rendered page', !$('bd-main').textContent.includes('—'), '');
  } catch (e) {
    ok('the harness ran to the end', false, e && e.message ? e.message : String(e));
  }

  const bad = results.filter((r) => r.startsWith('FAIL'));
  document.title = bad.length ? `${bad.length} FAIL` : 'ALL PASS';
  const pre = document.createElement('pre');
  pre.textContent = results.join('\n');
  document.body.appendChild(pre);
});
</script>
</body></html>
