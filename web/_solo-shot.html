<!doctype html>
<!--
  Development harness, never shipped: build-web.py copies only the files it
  names, so nothing here reaches dist/.

  Drives the schematic into its study view and walks a few signals, purely so a
  screenshot can be taken of it. Fullscreen needs a click and there is no deep
  link for it, so without this the one mode of the one page that cannot be
  photographed headlessly is the mode most likely to be wrong.

    _solo-shot.html?w=1280&h=800&walk=3&tab=io&steps=40&fit=1

  walk  how many signals to follow    tab   which console tab to open
  steps half-cycles to run first      fit   press 0, showing the whole ribbon
-->
<html lang="en"><head><meta charset="utf-8"><title>shot</title>
<style>html,body{margin:0;background:#05070d}iframe{border:0;display:block}</style>
</head><body>
<iframe id="f" src="schematic?signal=dpc3_SBX"></iframe>
<script type="module">
const p = new URLSearchParams(location.search);
const f = document.getElementById('f');
f.style.width = (p.get('w') || 1280) + 'px';
f.style.height = (p.get('h') || 800) + 'px';
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
f.addEventListener('load', async () => {
  const w = f.contentWindow, d = f.contentDocument;
  const $ = (id) => d.getElementById(id);
  for (let i = 0; i < 300 && $('sch-main').hidden; i++) await sleep(50);
  delete w.Element.prototype.requestFullscreen;
  delete w.Element.prototype.webkitRequestFullscreen;
  $('sch-fullscreen').click();
  await sleep(400);
  const svg = $('sch-svg');
  for (let i = 0; i < Number(p.get('walk') || 3); i++) {
    const cur = svg.querySelector('.sch-island.current');
    const n = [...cur.querySelectorAll('.sch-node')].find((x) => !x.classList.contains('root'))
      || [...svg.querySelectorAll('.sch-node')].find((x) => !x.classList.contains('root'));
    if (!n) break;
    n.dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
    await sleep(200);
  }
  if (p.get('tab')) {
    d.querySelector(`.sp-icon[data-tab="${p.get('tab')}"]`).click();
    for (let i = 0; i < Number(p.get('steps') || 0); i++) $('solo-step').click();
  }
  if (p.get('fit')) d.dispatchEvent(new w.KeyboardEvent('keydown', { key: '0', bubbles: true }));
  await sleep(300);
  document.title = 'ready';
});
</script>
</body></html>
