<!doctype html>
<!--
  Development harness, never shipped.

  Drives the real app's event handlers and reports anything that throws.

  This complements _resize-test.html, which exercises the renderer in isolation.
  A handler that throws does not look like an error to the user: it looks like
  the app freezing, and then -- the moment anything resizes the canvas, which
  clears it -- like the picture vanishing. So the handlers are worth checking on
  their own.

  Animation frames are throttled to nearly nothing for an iframe in headless, so
  nothing here depends on the app's render loop running. Events are dispatched
  directly and handlers run synchronously.

    http://localhost:8777/_handler-test.html
-->
<html lang="en"><head><meta charset="utf-8"><title>pending</title>
<style>
  body { margin: 0; background: #0b1120; color: #eaf2ff; font: 12px ui-monospace, monospace; }
  iframe { width: 1100px; height: 800px; border: 0; }
  pre { padding: 1rem; white-space: pre-wrap; }
  .f { color: #fb7185; }
</style></head><body>
<iframe id="f" src="index.html"></iframe>
<script type="module">
const results = [];
const errors = [];
const ok = (name, cond, detail) =>
  results.push(`${cond ? 'PASS' : 'FAIL'} ${name}${detail ? ' :: ' + detail : ''}`);

const f = document.getElementById('f');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

f.addEventListener('load', async () => {
  const w = f.contentWindow;
  const d = f.contentDocument;
  w.addEventListener('error', (e) => errors.push(`${e.message} @ ${e.lineno}:${e.colno}`));
  w.addEventListener('unhandledrejection', (e) => errors.push('rejection: ' + e.reason));

  await wait(6000);
  ok('app booted', !d.getElementById('app').hidden, `boot hidden=${d.getElementById('boot').hidden}`);

  /** Run one interaction and report whether it threw. */
  const step = async (name, fn) => {
    const before = errors.length;
    try {
      fn();
    } catch (e) {
      errors.push(`${name}: ${e && e.message}`);
    }
    await wait(250);
    ok(name, errors.length === before, errors.slice(before).join(' | '));
  };

  await step('window resize event', () => w.dispatchEvent(new w.Event('resize')));
  await step('reset-view button', () => d.getElementById('btn-fit').click());
  await step('wheel zoom in', () => d.getElementById('die').dispatchEvent(
    new w.WheelEvent('wheel', { deltaY: 240, clientX: 400, clientY: 300, bubbles: true, cancelable: true })));
  await step('wheel zoom out', () => d.getElementById('die').dispatchEvent(
    new w.WheelEvent('wheel', { deltaY: -240, clientX: 400, clientY: 300, bubbles: true, cancelable: true })));
  await step('resize again after zooming', () => w.dispatchEvent(new w.Event('resize')));
  await step('speed to 0.1x', () => {
    const s = d.getElementById('speed');
    s.value = '0.1';
    s.dispatchEvent(new w.Event('change'));
  });
  await step('invert zoom toggle', () => {
    const c = d.getElementById('invert-zoom');
    c.checked = true;
    c.dispatchEvent(new w.Event('change'));
  });
  await step('lab tab', () => d.querySelector('.tab[data-tab="lab"]').click());
  await step('lab start', () => d.querySelector('[data-lab-start]').click());
  await step('lab next', () => d.getElementById('lab-next').click());
  await step('lab pick adc', () => {
    const s = d.getElementById('lab-pick');
    s.value = 'adc';
    s.dispatchEvent(new w.Event('change'));
  });
  await step('resize while lab is open', () => w.dispatchEvent(new w.Event('resize')));
  await step('program select back', () => {
    const s = d.getElementById('program-select');
    s.value = '1';
    s.dispatchEvent(new w.Event('change'));
  });
  await step('transport: step instruction', () => d.getElementById('btn-instr').click());
  await step('fullscreen button', () => d.getElementById('btn-fullscreen').click());

  // --- two-finger pinch ---------------------------------------------------
  // The one gesture headless cannot produce on its own, and the one that hid a
  // NaN for the whole life of the project. Synthesised here from raw pointer
  // events. Pointer capture is stubbed out because setPointerCapture rejects an
  // id that never belonged to a real pointer; nothing else is faked.
  const die = d.getElementById('die');
  die.setPointerCapture = () => {};
  die.releasePointerCapture = () => {};
  const touch = (type, id, x, y) => die.dispatchEvent(new w.PointerEvent(type, {
    pointerId: id, pointerType: 'touch', clientX: x, clientY: y,
    bubbles: true, cancelable: true,
  }));

  await step('pinch: two fingers down, then spread', () => {
    touch('pointerdown', 1, 400, 300);
    touch('pointerdown', 2, 500, 300);      // seeds the pinch
    touch('pointermove', 2, 560, 320);      // the move that used to poison it
    touch('pointermove', 1, 340, 280);
    touch('pointermove', 2, 620, 360);
    touch('pointerup', 1, 340, 280);
    touch('pointerup', 2, 620, 360);
  });

  await wait(400);
  const c = d.getElementById('die');
  ok('pinch left the canvas alive', c.width > 0 && c.height > 0,
     `backing=${c.width}x${c.height}`);

  // The camera is not observable from in here, so assert the invariant that
  // made the bug possible instead: pinch state must have exactly one
  // constructor. It previously had two, spelled differently ({x,y} versus
  // {cx,cy}), and the mismatch fed NaN straight into the camera.
  // --- fullscreen with no Fullscreen API (an iPhone) -----------------------
  // iOS Safari implements fullscreen for video elements only, so on a phone
  // requestFullscreen is simply absent. Removing it here reproduces that
  // exactly; the button must still fill the viewport rather than do nothing.
  const con = d.getElementById('console');
  const fsBtn = d.getElementById('btn-fullscreen');
  if (con.classList.contains('immersive')) fsBtn.click();   // start from a known state
  await wait(300);

  delete w.Element.prototype.requestFullscreen;
  delete w.Element.prototype.webkitRequestFullscreen;
  con.requestFullscreen = undefined;
  con.webkitRequestFullscreen = undefined;

  await step('fullscreen without the API', () => fsBtn.click());
  await wait(400);
  ok('falls back to covering the viewport',
     con.classList.contains('immersive') && con.classList.contains('faux'),
     `classes="${con.className}"`);
  ok('fallback locks the page behind it',
     d.body.classList.contains('no-scroll'), `body="${d.body.className}"`);
  ok('fallback actually fills the screen', (() => {
    const r = con.getBoundingClientRect();
    return r.width >= w.innerWidth - 2 && r.height >= w.innerHeight - 2;
  })(), `console=${Math.round(con.getBoundingClientRect().width)}x${Math.round(con.getBoundingClientRect().height)} ` +
        `viewport=${w.innerWidth}x${w.innerHeight}`);
  ok('button reflects the state', fsBtn.textContent.trim() === '⤡', `"${fsBtn.textContent}"`);

  await step('exit the fallback', () => fsBtn.click());
  // Poll rather than sleep a fixed 300ms. Leaving fullscreen runs an async
  // verification (webkit's request returns undefined, so a resolved await
  // proves nothing), and on a loaded machine that can outlast any constant --
  // this assertion failed roughly one run in four for exactly that reason,
  // which is worse than useless: an intermittent red that is not a bug.
  for (let i = 0; i < 60; i++) {
    if (!con.classList.contains('immersive') && !d.body.classList.contains('no-scroll')) break;
    await wait(50);
  }
  ok('fallback exits cleanly',
     !con.classList.contains('immersive') && !con.classList.contains('faux') &&
     !d.body.classList.contains('no-scroll'),
     `console="${con.className}" body="${d.body.className}"`);

  const src = await (await fetch('app.js')).text();
  const assigns = [...src.matchAll(/lastPinch\s*=\s*([^;]+);/g)].map((m) => m[1].trim());
  ok('pinch state is never an inline literal',
     assigns.length > 0 && assigns.every((a) => a === 'null' || !a.includes('{')),
     assigns.join(' | ') || 'no assignments found');
  ok('pinch reads match what pinchOf builds',
     !/lastPinch\.(?!dist|cx|cy)\w+/.test(src),
     (src.match(/lastPinch\.\w+/g) || []).join(' '));

  const failed = results.filter((x) => x.startsWith('FAIL'));
  document.title = failed.length ? `${failed.length} FAILURES` : 'ALL PASS';
  document.body.insertAdjacentHTML('beforeend',
    `<pre id="hz" class="${failed.length ? 'f' : ''}">${results.join('\n')}` +
    `\n\nall errors seen:\n  ${errors.length ? errors.join('\n  ') : 'none'}</pre>`);
});
</script>
</body></html>
