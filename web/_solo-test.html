<!doctype html>
<!--
  Development harness, never shipped.

  Drives the REAL schematic page in an iframe, because this is about what the
  shipped markup and stylesheet do together. A hand-written stub was tried first
  and failed on its own inaccuracy: it nested .console-bar inside #sch-main,
  where the real page has it as a direct child, so a `>` selector that works in
  production did not match in the test.

  An iframe is safe for this one. The rule against it exists because headless
  throttles animation frames to nearly zero inside a frame, so anything that
  depends on rAF looks broken -- but nothing here does. render() is synchronous;
  only the live-state repaint uses rAF, and this asserts nothing about that.

    http://localhost:8777/_solo-test.html
-->
<html lang="en"><head><meta charset="utf-8"><title>pending</title>
<style>body{margin:0;background:#0b1120;color:#eaf2ff;font:12px ui-monospace,monospace}
iframe{width:1100px;height:760px;border:0}pre{padding:1rem;white-space:pre-wrap}</style>
</head><body>
<iframe id="f"></iframe>
<script type="module">
// Same origin, so this is the storage the page reads. The console's
// configuration is saved now, and a setting left over from a previous run --
// or from somebody using the page in this browser -- would be a hidden input to
// every assertion below. _persist-test.html is where saving is checked.
localStorage.removeItem('v6502.schematic.console');
// The same trap, one page later: the schematic runs whichever program was
// chosen last anywhere on the site, and the memory assertion below reads the
// first one's bytes out of the chip. A leftover choice would fail it while
// nothing was actually wrong.
localStorage.removeItem('v6502.program');
document.getElementById('f').src = 'schematic?signal=dpc3_SBX&depth=3';

const results = [];
const ok = (n, c, d) => results.push(`${c ? 'PASS' : 'FAIL'} ${n}${d ? ' :: ' + d : ''}`);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.getElementById('f');

f.addEventListener('load', async () => {
  const w = f.contentWindow, d = f.contentDocument;
  const $ = (id) => d.getElementById(id);
  const vis = (el) => !!el && w.getComputedStyle(el).display !== 'none';
  try {
    for (let i = 0; i < 300 && $('sch-main').hidden; i++) await sleep(50);
    ok('the real page booted', !$('sch-main').hidden, $('sch-status').textContent);

    const con = d.querySelector('.console');
    const svg = $('sch-svg');
    // The walk is one merged drawing: every signal appears exactly once, however
    // many of the steps reached it.
    const graph = () => svg.querySelector('.sch-graph');
    const rootNow = () => graph().querySelector('.sch-node.root').dataset.node;
    const pickOther = () => [...svg.querySelectorAll('.sch-node')]
      .find((n) => !n.classList.contains('root'));

    // The invariant the merge exists for. A signal drawn twice is the fastest
    // way to lose track of which one you were following, and drawing every step
    // as its own island produced one copy per step that reached it.
    const dupes = () => {
      const seen = new Map();
      for (const n of svg.querySelectorAll('.sch-node')) {
        seen.set(n.dataset.node, (seen.get(n.dataset.node) || 0) + 1);
      }
      return [...seen].filter(([, n]) => n > 1).map(([id]) => id);
    };

    // How far the walk has gone, read off the Walk drawer's own list -- the
    // drawing itself no longer says, which is the point.
    const steps = () => {
      const open = $('solo-palette').dataset.open;
      if (open !== 'walk') d.querySelector('.sp-icon[data-tab="walk"]').click();
      const n = d.querySelectorAll('#sp-walk .sp-step').length;
      if (open !== 'walk') d.querySelector(`.sp-icon[data-tab="${open}"]`).click();
      return n;
    };
    // Jump to a named signal through the page's own picker. The filter narrows
    // it to one entry first, because the list is capped at 400 and a name is
    // not guaranteed to be in the first 400 alphabetically.
    const goTo = (name) => {
      $('sch-filter').value = name;
      $('sch-filter').dispatchEvent(new w.Event('input', { bubbles: true }));
      const sel = $('sch-signal');
      const opt = [...sel.options].find((o) => o.textContent === name);
      sel.value = opt.value;
      sel.dispatchEvent(new w.Event('change', { bubbles: true }));
    };
    // Force the fallback path: the API is unavailable in an iframe anyway, and
    // removing it makes that explicit rather than incidental.
    delete w.Element.prototype.requestFullscreen;
    delete w.Element.prototype.webkitRequestFullscreen;
    con.requestFullscreen = undefined;
    con.webkitRequestFullscreen = undefined;

    const depthBefore = $('sch-depth').value;
    ok('starts at the depth the URL asked for', depthBefore === '3', depthBefore);

    $('sch-fullscreen').click();
    for (let i = 0; i < 60 && !con.classList.contains('solo'); i++) await sleep(50);
    ok('fullscreen enters the study view', con.classList.contains('solo'), con.className);
    // It used to drop to a single level on the way in. That made sense when the
    // mode showed one cone with nothing else on screen; it is a workbench now,
    // and arriving to less than the page was already showing is a jolt with
    // nothing to recommend it.
    ok('it arrives showing what the page was showing',
       $('sch-depth').value === depthBefore, `${$('sch-depth').value} vs ${depthBefore}`);

    // The point of the mode: nothing on screen but the circuit.
    const hidden = ['.console-bar', '.sch-controls', '.sch-caption',
                    '#sch-signal-info', '.sch-keybox', '.sch-compare'];
    const showing = hidden.filter((sel) => vis(d.querySelector(sel)));
    ok('everything except the circuit is out of the way', showing.length === 0,
       showing.join(', '));

    ok('the circuit is still drawn', svg.querySelectorAll('.sch-node').length > 0,
       `${svg.querySelectorAll('.sch-node').length} signals`);
    // viewBox + 100% sizing is what centres it; nothing measures anything.
    const cs = w.getComputedStyle(svg);
    ok('the drawing is sized to its stage, so it centres',
       parseFloat(cs.width) > 200 && parseFloat(cs.height) > 100,
       `${cs.width} x ${cs.height}`);
    ok('there is a way out', vis($('sch-solo-exit')));

    // Walking: click a signal, stay in the mode, stay at one level.
    ok('one step to begin with', steps() === 1, `${steps()}`);
    const next = pickOther();
    const want = next.dataset.node;
    next.dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
    await sleep(250);
    ok('clicking a signal re-roots without leaving the mode',
       con.classList.contains('solo') && rootNow() === want, con.className);
    ok('and it is still at the depth it came in with',
       $('sch-depth').value === depthBefore, $('sch-depth').value);

    // --- the walk stays on the bench, as one drawing -------------------------
    //
    // Where you came from is the context for where you are, and throwing it away
    // on every click made the study view a series of unrelated pictures. But
    // keeping each step as its own island drew every shared signal twice, which
    // is worse than either: tracing a value, a reader found two copies of it and
    // no way to tell which was which. The steps are merged instead.
    ok('the step you came from is still on the bench', steps() === 2, `${steps()}`);
    ok('and every signal is drawn exactly once', dupes().length === 0,
       `${dupes().length} duplicated: ${dupes().slice(0, 4).join(', ')}`);
    // ...and that assertion can tell. An invariant nothing could violate is not
    // an invariant, and this one passed vacuously until the selector was right.
    const twin = graph().querySelector('.sch-node');
    twin.parentElement.append(twin.cloneNode(true));
    ok('the check would notice a second copy',
       dupes().length === 1 && dupes()[0] === twin.dataset.node, dupes().join(', '));
    twin.parentElement.lastElementChild.remove();
    ok('and it is clean again once that copy is gone', dupes().length === 0);
    ok('the signal it came from among them',
       [...svg.querySelectorAll('.sch-node')]
         .filter((n) => n.dataset.node === want).length === 1);

    // The subject is marked by what it sits on, there being no island to shade.
    const card = svg.querySelector('.sch-bench-card');
    const cardBox = () => card.getBoundingClientRect();
    const rootBox = () => graph().querySelector('.sch-node.root').getBoundingClientRect();
    ok('the signal being studied sits on a shaded card',
       !!card && cardBox().width >= rootBox().width
       && cardBox().left <= rootBox().left + 1 && cardBox().top <= rootBox().top + 1,
       card ? `card ${cardBox().width.toFixed(0)} vs pill ${rootBox().width.toFixed(0)}` : 'none');

    // Following a *control line* is the awkward case: a control is never drawn
    // as a signal, deliberately, so the step lands on something that has no pill
    // anywhere on the drawing. Under the old ribbon that produced an island
    // joined to nothing; here it has to merge in like any other step.
    const ctrlLabel = () => [...graph().querySelectorAll('.sch-ctrl')]
      .find((t) => t.dataset.node);
    if (ctrlLabel()) {
      const was = steps();
      const which = ctrlLabel().dataset.node;
      ctrlLabel().dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
      await sleep(200);
      ok('following a control line takes a step', steps() === was + 1,
         `${was} -> ${steps()}`);
      ok('and it becomes the subject, drawn once',
         rootNow() === which && [...svg.querySelectorAll('.sch-node')]
           .filter((n) => n.dataset.node === which).length === 1, rootNow());
      ok('with everything else still drawn once too', dupes().length === 0,
         dupes().slice(0, 4).join(', '));
    } else {
      ok('there was a control line to follow', false, 'none drawn');
    }

    // Reading size is the claim, and a pill measures it directly: every pill is
    // the same 22 drawing units tall, so its height on screen *is* the effective
    // zoom. The viewBox is one island and the camera moves the world within it,
    // which is what keeps that height steady however long the ribbon gets --
    // fitting the world into the viewBox instead would shrink it by the length
    // of the walk.
    const pillH = () => graph().querySelector('.sch-pill').getBoundingClientRect().height;
    ok('the new island is framed at reading size', pillH() > 10, `${pillH().toFixed(1)}px pills`);

    // A bench keeps what is put on it. Adding an island must not move the
    // camera -- which is only possible because the study view's coordinate
    // space is fixed rather than sized to whatever is currently drawn.
    const camOf = () => svg.querySelector('.sch-cam').getAttribute('transform');
    const zoomOf = () => Number(/scale\(([-\d.e+]+)\)/.exec(camOf())[1]);
    const parked = zoomOf();
    const one = pickOther();
    one.dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
    await sleep(200);
    // A bench keeps what is put on it: adding an island never rescales the
    // view. It may *pan*, and only by the least it can -- the island you just
    // clicked into being has to be somewhere you can see, and a walk long
    // enough eventually reaches the edge of the screen.
    ok('adding an island does not rescale the view', zoomOf() === parked,
       `${parked} -> ${zoomOf()}`);
    const inView = () => {
      const a = graph().querySelector('.sch-node.root').getBoundingClientRect();
      const b = svg.getBoundingClientRect();
      return a.left >= b.left - 1 && a.right <= b.right + 1
          && a.top >= b.top - 1 && a.bottom <= b.bottom + 1;
    };
    ok('and the signal it walked to is on screen', inView());
    ok('and the bench itself does not move either',
       svg.getAttribute('viewBox') === '0 0 1200 800', svg.getAttribute('viewBox'));

    // The dots are the only thing that makes zoom visible on an empty field,
    // and they have to be *inside* the camera group or they would not move.
    const grid = svg.querySelectorAll('.sch-cam > .sch-grid');
    ok('the bench is dotted, inside the camera', grid.length === 2, `${grid.length} grids`);

    for (let i = 0; i < 5; i++) {
      const n = pickOther();
      if (!n) break;
      n.dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
      await sleep(160);
    }
    ok('the walk is capped rather than growing without limit',
       steps() === 6, `${steps()} steps after 8 clicks`);
    ok('and still no signal is drawn twice', dupes().length === 0,
       dupes().slice(0, 4).join(', '));
    ok('and the subject is still at reading size six steps in',
       pillH() > 10, `${pillH().toFixed(1)}px pills`);

    // --- the clock, pinned to one island ------------------------------------
    //
    // The point of this mode is watching an edge happen on six wires. That needs
    // a transport inside the mode, and a rate that is watchable: the page loop
    // runs eight half-cycles per animation frame, which is far too fast to
    // follow, so the study view is paced in wall-clock time instead.
    const clock = () => $('solo-clock').textContent;
    ok('the clock readout is shown', vis($('solo-clock')) && clock().includes('cyc'), clock());

    const at = () => Number(/½cyc (\d+)/.exec(clock())?.[1] ?? -1);
    const t0 = at();
    ok('the readout reports a half-cycle', t0 >= 0, String(t0));

    $('solo-step').click();
    await sleep(120);
    ok('stepping advances the clock', at() === t0 + 1, `${t0} -> ${at()}`);

    $('solo-back').click();
    await sleep(120);
    ok('and stepping back rewinds it', at() === t0, `${at()} vs ${t0}`);

    // Arrow keys, since the mode is meant to be looked at rather than aimed at.
    d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
    await sleep(120);
    ok('the right arrow steps', at() === t0 + 1, `${t0} -> ${at()}`);
    d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowLeft', bubbles: true }));
    await sleep(120);
    ok('the left arrow goes back', at() === t0, String(at()));

    // Space toggles running. The *rate* is deliberately not asserted here: the
    // paced runner is driven by animation frames, and an iframe throttles those
    // to nearly nothing -- so a run of half a second advances the clock by zero
    // or one depending on scheduling. That is the iframe rule doing exactly what
    // it says, and weakening the assertion to accommodate it would leave
    // something that passes whatever happens. What can be checked without a
    // frame is the state itself.
    d.dispatchEvent(new w.KeyboardEvent('keydown', { key: ' ', bubbles: true }));
    await sleep(80);
    ok('space starts it running', $('solo-run').classList.contains('on'),
       $('solo-run').className);
    d.dispatchEvent(new w.KeyboardEvent('keydown', { key: ' ', bubbles: true }));
    await sleep(80);
    ok('space stops it again', !$('solo-run').classList.contains('on'));

    const stopped = at();
    await sleep(250);
    ok('and it really is stopped', at() === stopped, `${stopped} -> ${at()}`);

    // Stepping while it was running must have paused it rather than fighting it.
    d.dispatchEvent(new w.KeyboardEvent('keydown', { key: ' ', bubbles: true }));
    await sleep(60);
    $('solo-step').click();
    await sleep(60);
    ok('a step pauses a run rather than racing it',
       !$('solo-run').classList.contains('on'));

    // And the whole point: the drawing reflects the chip, not a static picture.
    const litAt = () => svg.querySelectorAll('.sch-node.hot, .sch-switch.open').length;
    const seen = new Set();
    for (let i = 0; i < 12; i++) {
      $('solo-step').click();
      await sleep(60);
      seen.add(litAt());
    }
    ok('what is lit changes as the chip is stepped', seen.size > 1,
       `${seen.size} distinct states over 12 half-cycles`);

    // --- where you have been -------------------------------------------------
    //
    // Re-rooting, flipping direction and changing depth all move you, and until
    // there was a stack there was no way back -- which matters most here, where
    // walking the islands is the whole activity.
    ok('back is offered, a signal having already been followed',
       !$('solo-back-nav').disabled);

    const wasAt = rootNow();
    const other = pickOther();
    const otherId = other.dataset.node;
    other.dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
    await sleep(200);
    ok('following a signal moves the subject', rootNow() === otherId, rootNow());
    const afterClick = steps();

    $('solo-back-nav').click();
    await sleep(200);
    ok('back returns to where you were', rootNow() === wasAt, `${rootNow()} vs ${wasAt}`);
    // Going back to a signal still on the ribbon walks back up it rather than
    // starting a new one -- the island beyond it is the step being undone.
    ok('and it un-walks rather than starting again',
       steps() === afterClick - 1, `${steps()} vs ${afterClick}`);
    ok('and back keeps the depth it was walked at',
       $('sch-depth').value === depthBefore, $('sch-depth').value);
    ok('forward is offered once you have gone back', !$('solo-fwd-nav').disabled);

    d.dispatchEvent(new w.KeyboardEvent('keydown', { key: ']', bubbles: true }));
    await sleep(200);
    ok('] goes forward again', rootNow() === otherId, rootNow());
    d.dispatchEvent(new w.KeyboardEvent('keydown', { key: '[', bubbles: true }));
    await sleep(200);
    ok('[ goes back', rootNow() === wasAt, rootNow());

    // --- the camera ----------------------------------------------------------
    //
    // Walking back has left one island, and the interesting camera claims are
    // about a ribbon, so put one back deliberately rather than depending on
    // whatever the walk above happened to end on.
    goTo('dpc3_SBX');
    await sleep(200);
    pickOther().dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
    await sleep(200);
    ok('there is a walk to aim the camera at', steps() >= 2, `${steps()}`);

    const camT = () => svg.querySelector('.sch-cam').getAttribute('transform');
    const camNums = () => (camT().match(/-?\d+(?:\.\d+)?(?:e[-+]?\d+)?/gi) || []).map(Number);
    const camK = () => camNums()[2];
    ok('the drawing rides on a camera group', camNums().length === 3, camT());
    const k0 = camK();

    // Two fingers, through the real handlers -- the gesture headless cannot
    // reach with hardware absent.
    //
    // The assertion that earns its place is that the pinch is *anchored*: the
    // point of the drawing under the midpoint must still be under the midpoint
    // afterwards. "Did the scale go up" looked like the obvious check and tests
    // nothing. Injecting the explorer's exact bug -- pinch state written with
    // one spelling and read with another -- leaves the zoom working, because
    // `new DOMPoint(undefined, undefined)` is (0, 0) rather than NaN, so the
    // gesture anchors on the corner of the screen and still scales by the right
    // ratio. Only the anchor shows it.
    const pt = (type, id, x, y, target) => target.dispatchEvent(
      new w.PointerEvent(type, {
        pointerId: id, clientX: x, clientY: y, bubbles: true, pointerType: 'touch',
      }));
    const contentUnder = (x, y) => {
      const m = svg.getScreenCTM();
      const p = new w.DOMPoint(x, y).matrixTransform(m.inverse());
      const [tx, ty, k] = camNums();
      return { x: (p.x - tx) / k, y: (p.y - ty) / k };
    };
    const box = svg.getBoundingClientRect();
    const mx = box.left + box.width / 2, my = box.top + box.height / 2;
    const held = contentUnder(mx, my);
    pt('pointerdown', 1, mx - 40, my, svg);
    pt('pointerdown', 2, mx + 40, my, svg);
    pt('pointermove', 1, mx - 120, my, w);
    pt('pointermove', 2, mx + 120, my, w);
    await sleep(80);
    ok('a pinch zooms in', camK() > k0 * 1.5, `${k0} -> ${camK()}`);
    const still = contentUnder(mx, my);
    ok('and it zooms about the fingers, not about somewhere else',
       Math.hypot(still.x - held.x, still.y - held.y) < 1,
       `held (${held.x.toFixed(1)}, ${held.y.toFixed(1)}) `
       + `-> (${still.x.toFixed(1)}, ${still.y.toFixed(1)})`);
    ok('and the camera stays finite',
       camNums().length === 3 && camNums().every(Number.isFinite) && !/NaN|Infinity/.test(camT()),
       camT());
    pt('pointerup', 1, mx - 120, my, w);
    pt('pointerup', 2, mx + 120, my, w);
    await sleep(60);

    // `0` no longer means "the framing the browser chose" -- it fits the whole
    // walk, which with several islands is necessarily smaller than one. So the
    // assertion is what it is for: everything on screen at once.
    d.dispatchEvent(new w.KeyboardEvent('keydown', { key: '0', bubbles: true }));
    await sleep(60);
    const sb = svg.getBoundingClientRect();
    const outside = [...svg.querySelectorAll('.sch-node')].filter((g) => {
      const r = g.getBoundingClientRect();
      return r.left < sb.left - 1 || r.right > sb.right + 1
          || r.top < sb.top - 1 || r.bottom > sb.bottom + 1;
    });
    ok('0 fits the whole walk on screen', outside.length === 0,
       `${outside.length} signals off screen`);
    // Fitting a two-island world into a 1200x800 bench can legitimately magnify,
    // so "k < 1" would be asserting the arithmetic rather than the behaviour.
    // What is being claimed is that it pulled back from wherever the reader was.
    ok('and it pulled back from where the pinch left it', camK() < 3, camT());

    // A drag that happens to end on a signal is panning, not choosing. Without
    // slop, every touch on a pill would register as a drag and select nothing.
    const stayAt = rootNow();
    const kBefore = camK();
    const txBefore = camNums()[0];
    const victim = pickOther();
    const vb = victim.getBoundingClientRect();
    pt('pointerdown', 3, vb.left + 4, vb.top + 4, svg);
    pt('pointermove', 3, vb.left + 64, vb.top + 44, w);
    pt('pointerup', 3, vb.left + 64, vb.top + 44, w);
    victim.dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
    await sleep(150);
    ok('a drag ending on a signal pans rather than selecting it',
       rootNow() === stayAt, `${rootNow()} vs ${stayAt}`);
    ok('the pan moved the camera without rescaling it',
       camK() === kBefore && camNums()[0] !== txBefore, camT());

    // --- the console ---------------------------------------------------------
    //
    // One draggable panel rather than three clusters nailed to three corners.
    // What has to be true: it goes where it is put, it cannot be put out of
    // reach, and the panel that carries an input does not lose what is being
    // typed into it when the chip advances.
    const pal = $('solo-palette');
    const stage = d.querySelector('.sch-stage');
    ok('the console is one panel', !!pal && vis(pal));
    ok('and it holds the clock, the walk and the way out',
       pal.contains($('solo-clock')) && pal.contains($('solo-back-nav'))
       && pal.contains($('sch-solo-exit')));
    // A vertical strip of icons, each opening the drawer onto one thing. The
    // strip is what stays when the drawer is shut, so the transport and the way
    // out live on it rather than behind it.
    ok('the strip carries an icon per drawer',
       $('sp-strip').querySelectorAll('.sp-icon[data-tab]').length === 5);
    ok('and the transport and the exit stay on the strip, not in a drawer',
       $('sp-strip').contains($('solo-run')) && $('sp-strip').contains($('sch-solo-exit')));

    const palAt = () => [parseFloat(pal.style.left), parseFloat(pal.style.top)];
    let id = 20;
    const dragBy = async (dx, dy) => {
      const g = $('sp-strip').getBoundingClientRect();
      const n = ++id;
      pt('pointerdown', n, g.left + 14, g.top + 6, $('sp-strip'));
      pt('pointermove', n, g.left + 14 + dx, g.top + 6 + dy, w);
      pt('pointerup', n, g.left + 14 + dx, g.top + 6 + dy, w);
      await sleep(60);
    };

    // Park it at the top left first: the default position is at the bottom, so
    // a downward drag from there would be measuring the clamp rather than the
    // drag. Which is worth its own assertion, and gets one.
    await dragBy(-4000, -4000);
    ok('it cannot be dragged off the top left', palAt().join() === '0,0', palAt().join());

    const [px, py] = palAt();
    await dragBy(100, 60);
    const [qx, qy] = palAt();
    ok('dragging the strip moves it', Math.abs(qx - px - 100) < 2 && Math.abs(qy - py - 60) < 2,
       `(${px}, ${py}) -> (${qx}, ${qy})`);

    // Dragged at the far corner it must stop at the edge, not leave. A panel
    // that can be lost off screen is one the reader cannot get back without
    // clearing storage.
    await dragBy(4000, 4000);
    const pr = pal.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    ok('and it cannot be dragged out of reach',
       pr.right <= sr.right + 1 && pr.bottom <= sr.bottom + 1 && pr.left >= sr.left - 1,
       `panel ${pr.left.toFixed(0)},${pr.top.toFixed(0)} in stage ${sr.width}x${sr.height}`);
    await dragBy(-4000, -2000);

    const tab = (name) => pal.querySelector(`.sp-icon[data-tab="${name}"]`);
    const body = () => $('sp-panel').textContent;

    // Carrying the page's depth in is only half of it: the page's own slider is
    // hidden in this mode, so the mode needs one of its own or the reader
    // arrives able to see the setting and not to change it.
    tab('walk').click();
    await sleep(80);
    const soloDepth = $('solo-depth');
    ok('the study view has a depth control of its own', !!soloDepth && vis(soloDepth));
    ok('and it agrees with the page it came from',
       soloDepth.value === $('sch-depth').value, `${soloDepth.value} vs ${$('sch-depth').value}`);
    const wider = String(Math.min(6, Number(soloDepth.value) + 1));
    soloDepth.value = wider;
    soloDepth.dispatchEvent(new w.Event('input', { bubbles: true }));
    await sleep(200);
    ok('moving it reaches further back', $('sch-depth').value === wider
       && $('solo-depth-val').textContent === wider, $('sch-depth').value);
    ok('and the drawing grew with it', svg.querySelectorAll('.sch-node').length > 1,
       `${svg.querySelectorAll('.sch-node').length} signals`);
    ok('with still no signal drawn twice', dupes().length === 0, dupes().slice(0, 4).join(', '));
    soloDepth.value = depthBefore;
    soloDepth.dispatchEvent(new w.Event('input', { bubbles: true }));
    await sleep(200);

    // Pressing an icon opens the drawer onto it; pressing the open one shuts
    // it, which is the only way back to a bench with nothing on it but a strip.
    tab('io').click();
    await sleep(80);
    ok('an icon opens the drawer onto its panel',
       pal.dataset.drawer === 'open' && pal.dataset.open === 'io'
       && $('sp-drawer-title').textContent === 'I/O', pal.dataset.open);
    ok('and the icon shows as the open one', tab('io').classList.contains('on'));
    tab('io').click();
    await sleep(80);
    ok('pressing it again shuts the drawer',
       pal.dataset.drawer === 'shut' && !vis($('sp-drawer')) && vis($('sp-strip')));
    tab('io').click();
    await sleep(80);
    ok('the I/O drawer reports the pads', /Address/.test(body()) && /Data/.test(body()),
       body().slice(0, 60));
    // Memory. The dump is the bus the chip is talking to, so the program that
    // was loaded has to be in it -- checked against the shared program list
    // rather than against whatever the page happens to show.
    tab('mem').click();
    await sleep(80);
    const { PROGRAMS, LOAD_ADDR } = await import('./programs.js');
    const follow = $('sp-mem-follow');
    const addr = $('sp-mem-at');
    addr.value = LOAD_ADDR.toString(16).padStart(4, '0');
    addr.dispatchEvent(new w.Event('input', { bubbles: true }));
    await sleep(120);
    ok('typing an address switches to following it', follow.value === 'fixed', follow.value);
    const rowFor = (a) => [...$('sp-dump').querySelectorAll('.sp-dump-row')]
      .find((r) => r.querySelector('b').textContent === a.toString(16).padStart(4, '0').toUpperCase());
    const row = rowFor(LOAD_ADDR);
    const want8 = PROGRAMS[0].bytes.slice(0, 8)
      .map((b) => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
    const got8 = row ? [...row.querySelectorAll('i')].map((i) => i.textContent).join(' ') : '';
    ok('and memory really holds the program that was loaded', got8 === want8,
       `${got8} vs ${want8}`);

    // The address field is in the half of the panel that is built once. If it
    // were rebuilt on every frame the reader could not type into it at all --
    // and at four half-cycles a second that failure is easy to miss by hand.
    addr.focus();
    addr.value = '01f0';
    addr.dispatchEvent(new w.Event('input', { bubbles: true }));
    for (let i = 0; i < 4; i++) { $('solo-step').click(); await sleep(60); }
    ok('and the address field survives the chip advancing',
       addr.value === '01f0' && d.activeElement === addr,
       `${addr.value}, focus ${d.activeElement && d.activeElement.id}`);

    // The stack. `JSR $0210` is the second instruction of the loaded program and
    // it is jumped back to forever, so running far enough must at some point
    // show its return address on the stack: $0204 -- the address of the last
    // byte of the JSR, high byte pushed first, so the low byte $04 is on top.
    //
    // Scanned for rather than sampled at a fixed half-cycle. Where in the loop
    // 160 steps happens to land is not a fact about the 6502, and an assertion
    // that depends on it would be pinning the harness's own arithmetic.
    tab('stack').click();
    await sleep(80);
    ok('the stack tab reports S and where it points',
       /Next push/.test(body()) && /Next pull/.test(body()));
    // And says nothing about how deep the stack is, because the chip does not
    // know: reset decrements S by three rather than clearing it.
    ok('and claims no depth', !/on the stack/i.test(body()));
    const rowsNow = () => [...$('sp-panel').querySelectorAll('.sp-stack-row')]
      .map((r) => [r.querySelector('b').textContent, r.querySelector('i').textContent]);
    let saw = null;
    for (let i = 0; i < 400 && !saw; i++) {
      $('solo-step').click();
      const r = rowsNow();
      if (r.length >= 2 && r[0][1] === '04' && r[1][1] === '02') saw = r;
    }
    await sleep(120);
    ok('the JSR return address turns up on the stack, low byte on top',
       !!saw, saw ? saw.slice(0, 2).map((r) => r.join('=')).join(' ')
                  : rowsNow().slice(0, 3).map((r) => r.join('=')).join(' '));
    ok('and the top of the stack is the byte just above S',
       !!saw && saw[0][0] === '$' + (0x100 + parseInt(/S\$?([0-9A-F]{2})/.exec(
         $('sp-panel').textContent.replace(/\s/g, ''))[1], 16) + 1)
         .toString(16).padStart(4, '0').toUpperCase(),
       saw ? saw[0][0] : '');

    // The two panels have to agree about the same bytes, since they are two
    // readings of one memory.
    tab('mem').click();
    await sleep(80);
    $('sp-mem-follow').value = 's';
    $('sp-mem-follow').dispatchEvent(new w.Event('change', { bubbles: true }));
    await sleep(120);
    const cell = (a) => {
      const r = [...$('sp-dump').querySelectorAll('.sp-dump-row')]
        .find((row) => Number.parseInt(row.querySelector('b').textContent, 16) === (a & 0xfff8));
      return r ? r.querySelectorAll('i')[a & 7].textContent : null;
    };
    const topAddr = saw ? Number.parseInt(saw[0][0].slice(1), 16) : 0;
    ok('and the hex dump shows the same byte at the same address',
       !!saw && cell(topAddr) === saw[0][1], `${cell(topAddr)} vs ${saw && saw[0][1]}`);

    // The pins come last, and that is not tidiness. This program installs no
    // interrupt handler, so the IRQ vector at $FFFE reads $0000, where memory is
    // $00 -- a BRK, which pushes three bytes and vectors to itself. Asserting
    // IRQ therefore leaves the chip in a BRK loop climbing down the stack
    // forever. That is the silicon being right, and it would wreck every
    // assertion about memory or the stack made after it.
    tab('io').click();
    await sleep(80);
    const pin = (n) => $('sp-pins').querySelector(`[data-pin="${n}"]`);
    ok('IRQ starts high', !pin('irq').classList.contains('low'), pin('irq').textContent);
    // SO is the one that comes out of reset low, and a panel that reported it
    // as "asserted" would be showing an assumed polarity rather than a measured
    // level. The button says which it is.
    ok('and SO starts low, as the reset sequence leaves it',
       pin('so').classList.contains('low'), pin('so').textContent);
    pin('irq').click();
    await sleep(80);
    ok('clicking pulls the pin low', pin('irq').classList.contains('low'),
       pin('irq').textContent);
    pin('irq').click();
    await sleep(80);
    ok('and clicking again releases it', !pin('irq').classList.contains('low'));

    // ...and the chip is now in that loop, which is itself the evidence the pin
    // reached the silicon rather than only the button.
    tab('stack').click();
    await sleep(80);
    const deep = rowsNow().length;
    for (let i = 0; i < 60; i++) $('solo-step').click();
    await sleep(120);
    ok('a pin with nowhere to vector leaves the chip pushing',
       rowsNow().length >= deep, `${deep} -> ${rowsNow().length} shown`);

    // A drag that starts on a button is still a drag. The strip is 2.5rem wide
    // and half of it is buttons, so refusing to move when the press lands on one
    // made it hard to grab -- and worse, the press still reached the button, so
    // dragging from the exit icon left the study view on release. That is one of
    // the two ways a reader loses a walk to a stray gesture.
    const exit = $('sch-solo-exit');
    const eb = exit.getBoundingClientRect();
    pt('pointerdown', 40, eb.left + 10, eb.top + 10, exit);
    pt('pointermove', 40, eb.left + 10, eb.top + 90, w);
    pt('pointerup', 40, eb.left + 10, eb.top + 90, w);
    exit.dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
    await sleep(150);
    ok('dragging from the exit icon moves the console rather than leaving',
       con.classList.contains('solo'), con.className);
    ok('and it really did move it', Math.abs(parseFloat(pal.style.top) - 90) < 40,
       pal.style.top);

    // Collapsing leaves the grip, and with it the clock -- the one readout
    // worth keeping when everything else is in the way.
    d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'p', bubbles: true }));
    await sleep(80);
    ok('p shuts the drawer, leaving the strip',
       pal.dataset.drawer === 'shut' && !vis($('sp-drawer')) && vis($('sp-strip')));
    ok('and the transport is still there to run the chip with', vis($('solo-run')));
    d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'p', bubbles: true }));
    await sleep(80);
    ok('p opens it again', pal.dataset.drawer === 'open' && vis($('sp-drawer')));

    $('sch-solo-exit').click();
    for (let i = 0; i < 60 && con.classList.contains('solo'); i++) await sleep(50);
    ok('leaving restores the page', !con.classList.contains('solo')
       && vis(d.querySelector('.sch-caption')));
    ok('and restores the depth it had', $('sch-depth').value === depthBefore,
       `${$('sch-depth').value} vs ${depthBefore}`);

    // --- which fullscreen, and why ------------------------------------------
    //
    // On a touch device the platform's own fullscreen is dismissed by a downward
    // swipe -- iPadOS uses the video gesture for it -- and a reader panning a
    // drawing does that by accident. No page can prevent it. The fallback has no
    // such gesture, so on a coarse pointer it is asked for instead, and the API
    // is not called at all.
    // The spy goes on the element, not on the prototype: this harness sets
    // `con.requestFullscreen = undefined` at the top to force the fallback, and
    // an own property shadows anything installed on the prototype afterwards.
    const asked = [];
    con.requestFullscreen = function req() {
      asked.push(1);
      return Promise.resolve();
    };
    const realMM = w.matchMedia.bind(w);
    const stubMM = (coarse) => {
      w.matchMedia = (q) => (/coarse|hover:\s*none/.test(q)
        ? { matches: coarse, media: q, addEventListener() {}, removeEventListener() {},
            addListener() {}, removeListener() {} }
        : realMM(q));
    };

    stubMM(true);
    $('sch-fullscreen').click();
    for (let i = 0; i < 60 && !con.classList.contains('immersive'); i++) await sleep(50);
    ok('on a touch device the swipe-dismissible fullscreen is not asked for',
       asked.length === 0 && con.classList.contains('faux'),
       `${asked.length} calls, console="${con.className}"`);
    $('sch-solo-exit').click();
    for (let i = 0; i < 60 && con.classList.contains('immersive'); i++) await sleep(50);

    // ...and the real one is still used where a swipe cannot take it away.
    stubMM(false);
    $('sch-fullscreen').click();
    await sleep(300);
    ok('but a pointer device still gets the real thing', asked.length === 1,
       `${asked.length} calls`);
    w.matchMedia = realMM;
    con.requestFullscreen = undefined;
    if (con.classList.contains('faux')) { $('sch-solo-exit').click(); await sleep(200); }
  } catch (e) {
    results.push('FAIL threw :: ' + (e && e.stack ? e.stack.split('\n')[0] : e));
  }
  document.title = results.every((r) => r.startsWith('PASS')) ? 'ALL PASS' : 'FAILURES';
  document.body.insertAdjacentHTML('beforeend', '<pre id="out">' + results.join('\n') + '</pre>');
});
</script>
</body></html>
