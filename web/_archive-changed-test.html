<!doctype html>
<!--
  Development harness, never shipped: build-web.py copies only the files it
  names, so nothing here reaches dist/.

  The archive index carries a "changed since the previous deploy" section,
  filled at runtime from the archive's build-info.json by the shared
  version-footer.js. It is a second reader of the same field the footer reads,
  so it must agree with the footer, and it has a HIDDEN state (no previous
  deploy) that a broken fetch would reproduce perfectly. So this asserts the
  section against the stamp directly, in whichever state the stamp is in.

  It has to be served FROM the archive's own root, not from web/. The archive
  is a different origin when it is on a different port, and the harness's own
  fetch of the stamp is then cross-origin and blocked -- which the first version
  of this file discovered by failing on every state at once. So copy it in:

    cp web/_archive-changed-test.html archive/public/_changed-test.html
    python3 tools/serve.py archive/public 8794
    http://localhost:8794/_changed-test.html

  Do not leave it there. rsync copies everything in archive/public/, so a
  harness in that directory ships -- and the first draft of this comment
  claimed the opposite. archive-deploy.sh now excludes underscore-prefixed
  files as a backstop, but the copy is a temporary thing and should be removed
  when the run is done.
-->
<html lang="en"><head><meta charset="utf-8"><title>pending</title>
<style>body{margin:0;background:#0b1120;color:#eaf2ff;font:12px ui-monospace,monospace}
iframe{width:1100px;height:800px;border:0}pre{padding:1rem;white-space:pre-wrap}</style>
</head><body>
<iframe id="f"></iframe>
<script type="module">
const results = [];
const ok = (n, c, d) => results.push(`${c ? 'PASS' : 'FAIL'} ${n}${d ? ' :: ' + d : ''}`);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// Same origin: this file is copied into the archive's root to run.
const root = new URL('./', location.href).href;
const f = document.getElementById('f');
f.src = root + 'index.html';

// `once`, and it is load-bearing. The sub-index checks below navigate this
// same iframe, and each navigation fires `load` again -- which without `once`
// re-enters this whole handler from the top, which navigates again, which
// fires load again. The harness re-ran itself forever, produced no title and
// no output, and looked exactly like a headless hang. Two wrong hypotheses
// were tested and disproved before the recursion was seen.
f.addEventListener('load', async () => {
  const d = f.contentDocument;
  try {
    let info = null;
    try {
      info = await fetch(root + 'build-info.json', { cache: 'no-cache' }).then((r) => r.json());
    } catch (e) {
      ok('the archive is being served at its own root', false, `${root}build-info.json unreachable`);
    }
    if (!info) throw new Error('no stamp');
    ok('the stamp is the archive\'s own', info.kind === 'archive', `kind=${info.kind}`);

    // The three indexes each carry the slot; every other page must NOT. A
    // wiki article and a gallery chip page are somebody else's content in our
    // chrome, and a note saying they "changed" would read as being about the
    // content. So this checks a sample of each is slot-free before checking
    // the indexes.
    const wikiPages = await fetch(root + 'wiki/index.html').then((r) => r.text());
    const firstArticle = (wikiPages.match(/href="([A-Za-z0-9_%.-]+\.html)"/g) || [])
      .map((m) => m.slice(6, -1)).find((h) => h !== 'index.html' && h !== 'images.html');
    if (firstArticle) {
      const art = await fetch(root + 'wiki/' + firstArticle).then((r) => r.text());
      ok('a wiki article does NOT carry the slot', !art.includes('data-changed-since'),
         firstArticle);
    }
    // A chip page DOES carry it: the photographs are somebody else's, but the
    // page is ours, and the section only ever describes our deploys. What has
    // to hold instead is that the section comes AFTER the page has said what
    // it is -- the h1 and lede -- and before the attribution banner. The
    // first version emitted it from shell() above the h1, so a reader met a
    // deploy notice before the name of the chip.
    const chipList = await fetch(root + 'gallery/index.html').then((r) => r.text());
    const firstChip = (chipList.match(/href="chip\/[^"]+\.html"/) || [null])[0];
    let chipRel = null;
    if (firstChip) {
      chipRel = 'gallery/' + firstChip.slice(6, -1);
      const chip = await fetch(root + chipRel).then((r) => r.text());
      const at = (needle) => chip.indexOf(needle);
      ok('a gallery chip page carries the slot', at('data-changed-since') >= 0, chipRel);
      ok('and it comes after the title and lede, before the attribution banner',
         at('<h1') < at('class="lede"') && at('class="lede"') < at('data-changed-since')
         && at('data-changed-since') < at('class="banner"'),
         `h1@${at('<h1')} lede@${at('class="lede"')} slot@${at('data-changed-since')} banner@${at('class="banner"')}`);
    }

    const sec = d.querySelector('section.changed-since');
    ok('the overview index carries the slot', !!sec, sec ? 'present' : 'missing');
    // Wait for the module to have filled (or hidden) it.
    for (let i = 0; i < 100 && sec && sec.hidden && !sec.textContent.trim()
         && info.previousDeploy; i++) await sleep(50);

    const foot = d.querySelector('.version-foot');
    for (let i = 0; i < 100 && foot && !foot.querySelector('.vf-built'); i++) await sleep(50);
    const footNote = foot && foot.querySelector('.vf-changed');

    if (!info.previousDeploy) {
      ok('with no previous deploy the section stays hidden',
         sec.hidden && !sec.textContent.trim(), `hidden=${sec.hidden}`);
      ok('and the footer stays silent too', !footNote, footNote ? footNote.textContent : 'silent');
    } else if (!info.changed.length) {
      ok('with nothing changed the section says so rather than hiding',
         !sec.hidden && /Nothing a reader would see/.test(sec.textContent),
         sec.textContent.trim().slice(0, 60));
      ok('and agrees with the footer', !!footNote && /no page changed/.test(footNote.textContent),
         footNote ? footNote.textContent : 'no note');
    } else {
      const items = [...sec.querySelectorAll('.changed-list li')].map((li) => li.textContent.trim());
      ok('the section lists one entry per changed page',
         !sec.hidden && items.length === info.changed.length,
         `${items.length} items for ${JSON.stringify(info.changed)}`);
      const links = [...sec.querySelectorAll('.changed-list a')].map((a) => a.getAttribute('href'));
      ok('and each known page links to itself',
         links.every((h) => /^(index|wiki\/index|gallery\/index)\.html$/.test(h)),
         links.join(', ') || 'no links');
      const diff = sec.querySelector('.changed-diff a');
      ok('and offers the diff between the two deploys',
         !!diff && diff.href.includes('/compare/')
         && diff.href.includes(info.previousDeploy.slice(0, 12)),
         diff ? diff.href : 'no diff link');
      ok('and agrees with the footer', !!footNote && info.changed.every((k) =>
         footNote.textContent.includes(k === '' ? 'explorer' : k)),
         footNote ? footNote.textContent : 'no note');
    }
    ok('no em dash in the section', !sec || !sec.textContent.includes('—'), '');

    // --- the page in front of the mirror ---------------------------------------
    //
    // Entry points go THROUGH mirror.html, so a reader is told what the mirror
    // is (and that it has no way back) before entering it. Deep links do not:
    // a photograph's full-resolution original must stay a direct link into
    // full/images/, because a reader who clicked a picture wants the picture,
    // not a page about the archive.
    const wrapper = await fetch(root + 'mirror.html').then((r) => r.ok ? r.text() : null);
    ok('there is a page in front of the mirror', !!wrapper, wrapper ? 'mirror.html' : 'missing');
    if (wrapper) {
      ok('and it says what the mirror is, and that it has no way back',
         /exactly as captured/i.test(wrapper) && /no way back/i.test(wrapper), '');
      ok('and it enters the mirror by real links',
         /href="full\/index\.html"/.test(wrapper) && /href="full\/JSSim\/"/.test(wrapper), '');
    }
    const overview = await fetch(root + 'index.html').then((r) => r.text());
    ok('the overview\'s "Open the mirror" goes through the wrapper',
       /href="mirror\.html"[^>]*>Open the mirror/.test(overview)
       && !/class="go" href="full\/index\.html"/.test(overview), '');
    ok('and so does the menu\'s "Original site" entry',
       /href="mirror\.html"[^>]*>\s*<span class="navlink-label">Original site/.test(overview), '');
    if (chipRel) {
      const chipHtml = await fetch(root + chipRel).then((r) => r.text());
      // The photograph links specifically. The page as a whole DOES mention
      // mirror.html -- its header menu's "Original site" entry goes there,
      // which is the redirect above working -- so "no mirror.html anywhere on
      // the page" was the wrong negative, and failed on the correct behaviour.
      // `dl` is the per-image "full-resolution original" link, present on
      // every chip page. (`orig` is a description page or document beside the
      // images, which only some chips have -- the first draft keyed on it and
      // would have failed vacuously on a chip without one.)
      const origLinks = chipHtml.match(/class="dl" href="[^"]+"/g) || [];
      ok('but a photograph\'s original still links straight into full/images/',
         origLinks.length > 0
         && origLinks.every((h) => /href="\.\.\/full\/images\//.test(h))
         && !origLinks.some((h) => /mirror\.html/.test(h)),
         `${origLinks.length} original links on ${chipRel}`);
    }

    // --- the mirror is NOT touched, and that is asserted -----------------------
    //
    // full/ is a symlink into the byte-exact copy of visual6502.org. It carries
    // no section, no header, nothing of ours: it is a preservation copy, and a
    // "changed since the previous deploy" note on a page whose whole meaning is
    // that it has not changed since 2010 would be close to the opposite of
    // true. This is a documented decision, and a builder that started
    // rewriting mirror pages would break it silently -- so a mirror page is
    // fetched and checked to be free of every mark this archive adds.
    const mirror = await fetch(root + 'full/index.html').then((r) => r.ok ? r.text() : null);
    if (mirror === null) {
      ok('the mirror is served', false, 'full/index.html unreachable');
    } else {
      ok('the mirror carries no changed-since section', !mirror.includes('data-changed-since'), '');
      ok('and none of this archive\'s chrome at all',
         !mirror.includes('site-nav.js') && !mirror.includes('version-footer.js')
         && !mirror.includes('class="site-head"'),
         'a byte-exact copy of the original');
    }

    // --- the wiki and gallery indexes, at their own depth --------------------
    //
    // A relative href is where depth goes wrong, so each is loaded for real and
    // its self-link is checked to point at itself.
    // images.html is the wiki's contact sheet: ours, at the wiki's depth, so
    // its self-link is the wiki index rather than itself.
    const depthCases = [['mirror.html', 'index', 'index.html', 'index.html'],
                        ['wiki/index.html', 'wiki', 'index.html', '../index.html'],
                        ['wiki/images.html', 'wiki', 'index.html', '../index.html'],
                        ['gallery/index.html', 'gallery', 'index.html', '../index.html']];
    // A chip page is one level deeper still, so its self-link is ../index.html
    // (the collection) and the overview is two levels up.
    if (chipRel) depthCases.push([chipRel, 'gallery', '../index.html', '../../index.html']);
    for (const [rel, selfKey, selfHref, upHref] of depthCases) {
      // Attach before navigating, and never wait forever: an iframe already on
      // this URL, or one whose load fires before the listener is on, would
      // otherwise park the whole harness with no title and no output -- which
      // is exactly what the first version did, for ten minutes.
      // The timer is declared BEFORE the callback that clears it. The first
      // version had them the other way round, and when `load` fired
      // synchronously the callback reached `t` in its temporal dead zone,
      // threw inside the executor, and the promise neither resolved nor
      // surfaced the error -- the await parked forever, with no output.
      await new Promise((r) => {
        let t = null;
        const done = () => { if (t) clearTimeout(t); r(); };
        t = setTimeout(done, 8000);
        f.addEventListener('load', done, { once: true });
        f.src = root + rel + '?t=' + Date.now();
      });
      const dd = f.contentDocument;
      for (let i = 0; i < 100 && !dd.querySelector('section.changed-since'); i++) await sleep(50);
      const s2 = dd.querySelector('section.changed-since');
      for (let i = 0; i < 100 && s2 && !s2.textContent.trim()
           && !(s2.hidden && !info.previousDeploy); i++) await sleep(50);
      ok(`${rel} carries the slot`, !!s2, s2 ? 'present' : 'missing');
      if (!s2) continue;
      if (!info.previousDeploy) {
        ok(`${rel}: hidden with no previous deploy`, s2.hidden, `hidden=${s2.hidden}`);
      } else if (!info.changed.length) {
        ok(`${rel}: says nothing changed`, /Nothing a reader would see/.test(s2.textContent),
           s2.textContent.trim().slice(0, 40));
      } else {
        const links = [...s2.querySelectorAll('.changed-list a')]
          .map((a) => [a.textContent.trim(), a.getAttribute('href')]);
        ok(`${rel}: lists ${info.changed.length} entr${info.changed.length === 1 ? 'y' : 'ies'}`,
           s2.querySelectorAll('.changed-list li').length === info.changed.length,
           JSON.stringify(links));
        if (info.changed.includes(selfKey)) {
          ok(`${rel}: links to itself, from its own depth`,
             links.some(([, h]) => h === selfHref), JSON.stringify(links));
        }
        if (info.changed.includes('index')) {
          ok(`${rel}: links up to the overview correctly`,
             links.some(([, h]) => h === upHref), JSON.stringify(links));
        }
      }
    }
  } catch (e) {
    ok('the harness ran to the end', false, e && e.message ? e.message : String(e));
  }
  const bad = results.filter((r) => r.startsWith('FAIL'));
  document.title = bad.length ? `${bad.length} FAIL` : 'ALL PASS';
  const pre = document.createElement('pre');
  pre.textContent = results.join('\n');
  document.body.appendChild(pre);
}, { once: true });
</script>
</body></html>
