<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>chipmap test</title>
<!--
  The chip map: the partition, the bundles, the columns and the live boxes,
  re-derived here rather than taken from the page. The bundles and the columns
  are recomputed in full from schematic.json and the page's own group list,
  because they are the page's thesis: a layout that is a measurement. The
  ownership order is spot-checked at the joints it decides (pipe over chain,
  decimal over ALU, address latches over the store pipeline, the registers'
  global sharing), each of which the prose claims by name.
-->
<style>body{background:#0b1120;color:#dbe6f4;font:14px monospace}
iframe{width:1400px;height:900px;border:0}pre{padding:1rem;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="f"></iframe>
<script type="module">
import { registerLogic } from './register-logic.js';
import { decimalCorrection } from './decimal-correction.js';
import { PACKAGE, direction, pinFacts } from './pins.js';
import { assemble } from './asm.js';
import { TOUR, readerOf } from './chipmap-tour.js';

const results = [];
const ok = (name, cond, detail = '') => results.push(`${cond ? 'PASS' : 'FAIL'} ${name}${cond ? '' : ' :: ' + detail}`);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.getElementById('f');
const load = (src) => new Promise((r) => { f.addEventListener('load', r, { once: true }); f.src = src; });

(async () => {
  try {
    localStorage.removeItem('v6502.program');
    localStorage.removeItem('v6502.clock');
    // A persisted arrangement or console is a hidden input to every assertion.
    localStorage.removeItem('v6502.chipmap.layout');
    localStorage.removeItem('v6502.chipmap.console');
    const sch = await (await fetch('schematic.json')).json();

    await load('chipmap.html');
    const d = f.contentDocument;
    const w = f.contentWindow;
    for (let i = 0; i < 2000 && !w.__chipmap; i++) await sleep(50);
    ok('the page boots and exposes its derivation', !!w.__chipmap, 'no __chipmap after 100s');
    const { groups, bundles } = w.__chipmap;

    // --- the partition ------------------------------------------------------
    // Complete and disjoint against a universe computed HERE from the raw
    // arrays, not through the page's own helper.
    const universe = new Set();
    for (const [out, , pre, legs] of sch.gates) {
      universe.add(out);
      for (const leg of legs) for (const i of leg) universe.add(i);
      if (pre >= 0) universe.add(pre);
    }
    for (const [c, a, b] of sch.switches) { universe.add(c); universe.add(a); universe.add(b); }
    sch.names.forEach((n, i) => { if (n) universe.add(i); });
    universe.delete(sch.vss); universe.delete(sch.vcc);
    const owner = new Map();
    let dup = 0;
    for (const g of groups) for (const n of g.nodes) { if (owner.has(n)) dup++; owner.set(n, g); }
    ok('every node is in exactly one group', dup === 0 && owner.size === universe.size
       && [...owner.keys()].every((n) => universe.has(n)),
       `${dup} duplicated, ${owner.size} grouped of ${universe.size}`);
    ok('group keys are unique', new Set(groups.map((g) => g.key)).size === groups.length);

    // --- the ownership order, at the joints it decides ----------------------
    const byName = new Map(sch.names.map((n, i) => [n, i]).filter(([n]) => n));
    const pipeT = [...byName].filter(([n]) => /^pipeT\d(out)?/.test(n)).map(([, i]) => i);
    ok('the pipe latch file outranks the chain: every pipeT* latch files with it',
       pipeT.length > 0 && pipeT.every((n) => owner.get(n)?.kind === 'pipe'),
       pipeT.map((n) => `${sch.names[n]}:${owner.get(n)?.key}`).join(' '));
    const dec = decimalCorrection(sch).nodes;
    ok('the decimal correction outranks the ALU: its walk is intact',
       dec.every((n) => owner.get(n)?.key === 'decimal:bcd'),
       dec.filter((n) => owner.get(n)?.key !== 'decimal:bcd').map((n) => `${n}:${owner.get(n)?.key}`).join(' '));
    ok('the address latches outrank the store pipeline: SD1 files with their load line',
       owner.get(440)?.kind === 'alat', `440 -> ${owner.get(440)?.key}`);
    // The registers' sharing is global: a node in more than one register cone
    // is in a regs shared group, never in one register's own.
    const cones = [];
    for (const stem of ['s', 'a', 'x', 'y']) {
      const r = registerLogic(sch, { stem });
      cones.push([stem, r.register.nodes]);
      for (const L of r.lines) cones.push([`${stem}.${L.id}`, L.cone]);
    }
    const seen = new Map();
    for (const [id, ns] of cones) for (const n of ns) {
      if (!seen.has(n)) seen.set(n, []);
      seen.get(n).push(id);
    }
    const multi = [...seen].filter(([, ids]) => ids.length > 1).map(([n]) => n);
    ok('a node in two registers’ cones is in a shared group',
       multi.length > 0 && multi.every((n) => owner.get(n)?.key.startsWith('regs:shared.')),
       multi.filter((n) => !owner.get(n)?.key.startsWith('regs:shared.')).map((n) => `${n}:${owner.get(n)?.key}`).join(' '));

    // --- the stage and pin groups, re-derived in full -----------------------
    const stages = new Map();
    sch.nodeRole.forEach((role, n) => {
      if (role !== 1 || !sch.names[n]) return;
      const m = /^op-(T[0-5]|T\+)-/.exec(sch.names[n]);
      const id = m ? m[1] : 'any';
      if (!stages.has(id)) stages.set(id, []);
      stages.get(id).push(n);
    });
    let stageOk = true, stageWhy = '';
    for (const [id, ns] of stages) {
      const g = groups.find((x) => x.key === `stage:${id}`);
      if (!g || g.nodes.join() !== ns.sort((a, b) => a - b).join()) { stageOk = false; stageWhy = id; }
    }
    ok('the decode terms group by stage exactly as the names say', stageOk, stageWhy);
    const pf = pinFacts(sch);
    const dirs = new Map();
    const seenPins = new Set();
    for (const p of PACKAGE) {
      if (!p.node || p.power || seenPins.has(p.node)) continue;
      seenPins.add(p.node);
      const n = pf.byName.get(p.node);
      if (n === undefined) continue;
      const dir = direction(pf, p.node) || 'neither';
      if (!dirs.has(dir)) dirs.set(dir, []);
      dirs.get(dir).push(n);
    }
    // A pad an earlier container already claimed stays there: the sync pad is
    // the SYNC generator's, the clock outputs the clock generator's, rw the
    // read/write control's. What is left must match the measured directions
    // exactly, and everything subtracted must be owned by a container that
    // names it rather than lost.
    let pinOk = true, pinWhy = '';
    for (const [id, ns] of dirs) {
      const kept = ns.filter((n) => owner.get(n)?.kind === 'pins').sort((a, b) => a - b);
      const taken = ns.filter((n) => owner.get(n)?.kind !== 'pins');
      const g = groups.find((x) => x.key === `pins:${id}`);
      const gNodes = g ? g.nodes : [];
      if (gNodes.join() !== kept.join()) { pinOk = false; pinWhy = `${id}: page [${gNodes}] vs mine [${kept}]`; }
      if (!taken.every((n) => ['sync', 'clock', 'dbus'].includes(owner.get(n)?.kind))) {
        pinOk = false; pinWhy = `${id}: pad taken by ${taken.map((n) => owner.get(n)?.key).join(' ')}`;
      }
    }
    ok('the pins group by the pinout page’s measured directions, less the pads a container already names', pinOk, pinWhy);

    // --- the bundles, recounted in full --------------------------------------
    const gi = new Map(groups.map((g, i) => [g.key, i]));
    const own = new Int16Array(sch.names.length).fill(-1);
    groups.forEach((g, i) => { for (const n of g.nodes) own[n] = i; });
    const mine = new Map();
    const at = (a, b) => {
      const k = Math.min(a, b) * 1024 + Math.max(a, b);
      if (!mine.has(k)) mine.set(k, { g: 0, s: 0 });
      return mine.get(k);
    };
    for (const [out, , pre, legs] of sch.gates) {
      const ins = new Set(legs.flat());
      if (pre >= 0) ins.add(pre);
      for (const i of ins) {
        if (i === sch.vss || i === sch.vcc) continue;
        if (own[i] < 0 || own[out] < 0 || own[i] === own[out]) continue;
        at(own[i], own[out]).g++;
      }
    }
    for (const [c, a, b] of sch.switches) {
      if ([a, b].some((n) => n === sch.vss || n === sch.vcc)) continue;
      if (own[a] < 0 || own[b] < 0 || own[a] === own[b]) continue;
      at(own[a], own[b]).s++;
    }
    let bundleOk = mine.size === bundles.length, bundleWhy = `${mine.size} vs ${bundles.length}`;
    for (const bd of bundles) {
      const m = mine.get(Math.min(bd.a, bd.b) * 1024 + Math.max(bd.a, bd.b));
      if (!m || m.g !== bd.gates || m.s !== bd.switches) {
        bundleOk = false;
        bundleWhy = `${groups[bd.a].key}~${groups[bd.b].key}: page ${bd.gates}g/${bd.switches}s, mine ${m ? `${m.g}g/${m.s}s` : 'absent'}`;
        break;
      }
    }
    ok('every bundle carries exactly the edges the netlist has between its ends', bundleOk, bundleWhy);

    // --- the columns, re-derived from the pins ------------------------------
    const fwd = new Map();
    const add = (x, y) => { if (!fwd.has(x)) fwd.set(x, []); fwd.get(x).push(y); };
    for (const [out, , pre, legs] of sch.gates) {
      for (const i of new Set(legs.flat())) add(i, out);
      if (pre >= 0) add(pre, out);
    }
    for (const [, a, b] of sch.switches) { add(a, b); add(b, a); }
    const start = [];
    for (const g of groups) if (g.kind === 'pins' && (g.id === 'input' || g.id === 'bidirectional')) start.push(...g.nodes);
    const dist = new Map(start.map((n) => [n, 0]));
    const q = [...start];
    while (q.length) {
      const n = q.shift();
      for (const m of fwd.get(n) || []) {
        if (m === sch.vss || m === sch.vcc || dist.has(m)) continue;
        dist.set(m, dist.get(n) + 1);
        q.push(m);
      }
    }
    const median = (xs) => { const t = xs.slice().sort((a, b) => a - b); return t.length ? t[Math.floor(t.length / 2)] : Infinity; };
    const med = new Map(groups.map((g) => [g.key, median(g.nodes.map((n) => dist.get(n)).filter((x) => x !== undefined))]));
    const cols = [...new Set([...med.values()])].sort((a, b) => (a === Infinity) - (b === Infinity) || a - b);
    const colIx = new Map(cols.map((c, i) => [c, i]));
    const badCol = groups.filter((g) => g.colIx !== colIx.get(med.get(g.key)));
    ok('every group’s column is its median distance from the pins, recomputed here',
       badCol.length === 0, badCol.map((g) => `${g.key}: page ${g.colIx}, mine ${colIx.get(med.get(g.key))}`).slice(0, 4).join(' | '));
    ok('the pins are the first column',
       groups.filter((g) => g.kind === 'pins' && g.id !== 'output' && g.id !== 'neither').every((g) => g.colIx === 0));

    // --- the drawing: every group a box, and no two boxes intersect ----------
    const boxes = [...d.querySelectorAll('#cm-svg .cm-box')];
    ok('every group is drawn as a box, once', boxes.length === groups.length
       && new Set(boxes.map((b) => b.dataset.key)).size === groups.length,
       `${boxes.length} boxes for ${groups.length} groups`);
    let clash = null;
    for (let i = 0; i < groups.length && !clash; i++) {
      for (let j = i + 1; j < groups.length; j++) {
        const a = groups[i], b = groups[j];
        if (a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h) { clash = `${a.key} ~ ${b.key}`; break; }
      }
    }
    ok('no two boxes intersect', !clash, clash || '');

    // --- live: the boxes against a chip of this harness's own ---------------
    const { Machine, default: init } = await import('./pkg/v6502_wasm.js');
    await init();
    const { PROGRAMS, LOAD_ADDR } = await import('./programs.js');
    const m = new Machine();
    m.load(LOAD_ADDR, new Uint8Array(PROGRAMS[0].bytes));
    m.setResetVector(LOAD_ADDR);
    m.powerCycle();
    const stepBtn = [...d.querySelectorAll('.nav-tbtn')].find((b) => b.title === 'One half-cycle');
    ok('the header transport is on the page', !!stepBtn);
    for (let i = 0; i < 7; i++) { stepBtn.click(); m.halfStep(); }
    ok('the two chips agree about where they are', w.__chipmap.machine.halfCycle() === m.halfCycle(),
       `${w.__chipmap.machine.halfCycle()} vs ${m.halfCycle()}`);
    const levels = m.nodeLevels();
    let hiOk = true, hiWhy = '';
    for (const key of ['alu:bit3', 'stage:T0', 'pipe:unk']) {
      const g = groups.find((x) => x.key === key);
      const want = (0.5 * g.nodes.filter((n) => levels[n] > 0).length / g.nodes.length).toFixed(3);
      const got = d.querySelector(`.cm-box[data-key="${key}"]`).style.getPropertyValue('--hi').trim();
      if (Number(got) !== Number(want)) { hiOk = false; hiWhy = `${key}: page ${got}, mine ${want}`; break; }
    }
    ok('a box’s fill is the share of its members high on this harness’s chip', hiOk, hiWhy);

    // --- the opened boxes: the node grids ------------------------------------
    //
    // The glyph rule is re-derived: a square is exactly a node that controls
    // at least one switch, and everything drawn is exactly the universe. The
    // grid is asserted as a grid (snapped positions), the stated order is
    // checked on a byte group (bit 0 leftmost), and the live fill of a sample
    // square and dot is compared against this harness's chip, which is in
    // step with the page's.
    {
      const myControls = new Set(sch.switches.map(([c]) => c));
      myControls.delete(sch.vss); myControls.delete(sch.vcc);
      const sq = [...d.querySelectorAll('#cm-svg .cm-sw')].map((e) => Number(e.dataset.n));
      const dots = [...d.querySelectorAll('#cm-svg .cm-nd')].map((e) => Number(e.dataset.n));
      ok('every node is drawn as a glyph, once',
         sq.length + dots.length === universe.size
         && new Set([...sq, ...dots]).size === universe.size,
         `${sq.length} squares + ${dots.length} dots vs ${universe.size}`);
      ok('a square is exactly a node that holds switches',
         sq.every((n) => myControls.has(n)) && dots.every((n) => !myControls.has(n))
         && sq.length === [...myControls].filter((n) => universe.has(n)).length,
         `${sq.filter((n) => !myControls.has(n)).length} wrong squares, ${dots.filter((n) => myControls.has(n)).length} wrong dots`);
      const gA = groups.find((g) => g.key === 'regs:a');
      const glyphsA = [...d.querySelectorAll('.cm-box[data-key="regs:a"] [data-n]')];
      const aBits = [...Array(8).keys()].map((i) => sch.names.indexOf(`a${i}`));
      ok('a byte group reads left to right from bit 0',
         glyphsA.slice(0, 8).map((e) => Number(e.dataset.n)).join() === aBits.join(),
         glyphsA.slice(0, 8).map((e) => sch.names[e.dataset.n] || e.dataset.n).join(' '));
      const CELL = 13, GRID_PAD = 9;
      const cxOf = (e) => e.tagName === 'rect' ? Number(e.getAttribute('x')) + 3.5 : Number(e.getAttribute('cx'));
      const snapped = glyphsA.every((e, i) =>
        Math.abs(cxOf(e) - (gA.x + GRID_PAD + (i % 10) * CELL + CELL / 2)) < 0.01);
      ok('the grid is a grid: every glyph snapped to its cell', snapped);
      // Live: the sample glyphs read this harness's chip.
      const cclk = sch.names.indexOf('cclk');
      const lv = m.nodeLevels();
      ok('a square is filled exactly while its switches conduct',
         d.querySelector(`#cm-svg .cm-sw[data-n="${cclk}"]`).classList.contains('on') === (lv[cclk] > 0));
      const dotN = dots[0];
      ok('a dot is lit exactly while its node is high',
         d.querySelector(`#cm-svg .cm-nd[data-n="${dotN}"]`).classList.contains('on') === (lv[dotN] > 0));
      // One paired step: the ringed glyphs are exactly the changed nodes.
      const before = m.nodeLevels();
      stepBtn.click(); m.halfStep();
      await sleep(30);
      const after = m.nodeLevels();
      let myMoved = 0;
      for (const n of universe) if (after[n] !== before[n]) myMoved++;
      const rung = d.querySelectorAll('#cm-svg .cm-sw.mv, #cm-svg .cm-nd.mv').length;
      ok('the ringed glyphs are exactly the nodes that changed at the edge',
         rung === myMoved, `${rung} ringed vs ${myMoved} changed`);
      // The toggle folds the grids away and brings them back.
      d.getElementById('cm-nodes').click();
      await sleep(30);
      ok('the Nodes button folds the grids away',
         d.querySelectorAll('#cm-svg [data-n]').length === 0
         && d.querySelectorAll('#cm-svg .cm-box').length === groups.length);
      d.getElementById('cm-nodes').click();
      await sleep(30);
      ok('...and brings them back',
         d.querySelectorAll('#cm-svg .cm-sw, #cm-svg .cm-nd').length === universe.size);
      // A glyph click names its node on the card.
      const g0 = d.querySelector('.cm-box[data-key="regs:a"] .cm-nd, .cm-box[data-key="regs:a"] .cm-sw');
      g0.dispatchEvent(new f.contentWindow.MouseEvent('click', { bubbles: true }));
      await sleep(30);
      ok('clicking a glyph selects its group and names the node',
         !!d.querySelector('.cm-box.sel[data-key="regs:a"]')
         && /node a0:/.test(d.getElementById('cm-card').textContent),
         d.getElementById('cm-card').textContent.slice(0, 160));
      d.getElementById('cm-svg').dispatchEvent(new f.contentWindow.MouseEvent('click', { bubbles: true }));
      await sleep(30);
    }

    // --- the key: drawn with the drawing's own classes ------------------------
    {
      const key = d.getElementById('cm-key');
      ok('the page carries a key', !!key && key.querySelectorAll('.cm-key-row').length >= 6);
      const want = ['.cm-nd', '.cm-nd.on', '.cm-sw', '.cm-sw.on', '.cm-nd.mv',
                    '.cm-box .cm-bg', '.cm-box .cm-hi', '.cm-box.mv',
                    '.cm-bd', '.cm-bd.cm-bd-sw', '.cm-bd.open', '.cm-bd.fired'];
      const missing2 = want.filter((sel) => !key.querySelector(sel));
      ok('every key sample is built from the drawing’s own classes',
         missing2.length === 0, missing2.join(' '));
      ok('and the key writes no inline style, which the live CSP would refuse',
         !key.querySelector('[style]'));
    }

    // --- the walk: click, card, deep link ------------------------------------
    const box = d.querySelector('.cm-box[data-key="chain:T3"]');
    box.dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
    await sleep(50);
    ok('clicking a box selects it', box.classList.contains('sel')
       && d.getElementById('cm-svg').classList.contains('has-sel'));
    const card = d.getElementById('cm-card').textContent;
    ok('the card names the group and its wiring', /T3 cell/.test(card) && /wired to:/.test(card), card.slice(0, 120));
    const link = d.querySelector('#cm-card a.btn');
    ok('the card links to the same container on the tracer',
       !!link && link.getAttribute('href') === 'tracer?chain=T3',
       link ? link.getAttribute('href') : 'no link');
    const pill = d.querySelector('#cm-card .cm-pill');
    const pillName = pill.textContent.replace(/\s*×\d+$/, '');
    pill.click();
    await sleep(50);
    const selNow = groups.find((g) => d.querySelector(`.cm-box[data-key="${g.key}"]`).classList.contains('sel'));
    ok('a partner pill walks the selection to the far end',
       !!selNow && selNow.label === pillName && selNow.key !== 'chain:T3',
       `selected ${selNow?.key} after pill "${pillName}"`);
    d.getElementById('cm-svg').dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
    await sleep(50);
    ok('clicking empty ground clears the selection',
       !d.querySelector('.cm-box.sel') && !d.getElementById('cm-svg').classList.contains('has-sel'));

    // --- the deep link -------------------------------------------------------
    await load('chipmap.html?sel=regs:a');
    const d2 = f.contentDocument;
    for (let i = 0; i < 2000 && !f.contentWindow.__chipmap; i++) await sleep(50);
    ok('?sel= arrives selected', !!d2.querySelector('.cm-box.sel[data-key="regs:a"]'),
       d2.querySelector('.cm-box.sel')?.dataset.key || 'nothing selected');
    ok('and its card reads the byte off the chip', /reads \$[0-9A-F]{2}/.test(d2.getElementById('cm-card').textContent),
       d2.getElementById('cm-card').textContent.slice(0, 160));
    await load('chipmap.html?nodes=0');
    const d2b = f.contentDocument;
    for (let i = 0; i < 2000 && !f.contentWindow.__chipmap; i++) await sleep(50);
    ok('?nodes=0 arrives folded', d2b.querySelectorAll('#cm-svg [data-n]').length === 0
       && d2b.querySelectorAll('#cm-svg .cm-box').length > 0);
    // --- the tour: every authored claim, on a chip of this harness's own ----
    //
    // The narration is the weaker register, so each step's checks are
    // re-evaluated here against an independent machine running the tour's own
    // program, the Lab-test arrangement. Offsets are from the instruction's
    // fetch, found by sync and the assembler's label, never remembered.
    {
      const tm = new Machine();
      const img = assemble(TOUR.source);
      tm.load(img.org, new Uint8Array(img.bytes));
      tm.setResetVector(img.org);
      tm.powerCycle();
      const at = img.labels.get(TOUR.target);
      ok('the tour anchors to a label the program defines', at != null, TOUR.target);
      let guard = 0;
      while (!(tm.sync() && tm.lastFetchAddr() === at) && guard++ < 20000) tm.halfStep();
      ok('the tour instruction is fetched', guard < 20000);
      const h0 = tm.halfCycle();
      const r = readerOf(tm);
      let claimsOk = true, claimsWhy = '';
      for (const st of TOUR.steps) {
        while (tm.halfCycle() - h0 < st.at) tm.halfStep();
        for (const c of st.checks) {
          if (c.fn(r) !== true) { claimsOk = false; claimsWhy = `step +${st.at}: ${c.claim}`; }
        }
      }
      ok('every authored claim holds on this harness’s own chip', claimsOk, claimsWhy);
    }

    // The page's tour, driven through its own controls.
    await load('chipmap.html?tour=adc');
    const d3 = f.contentDocument;
    const w3 = f.contentWindow;
    for (let i = 0; i < 2000 && !w3.__chipmap; i++) await sleep(50);
    for (let i = 0; i < 200 && d3.getElementById('cmt-panel').hidden; i++) await sleep(50);
    ok('?tour= starts the tour', !d3.getElementById('cmt-panel').hidden);
    ok('...on step 1, with its subject selected',
       /step 1 of/.test(d3.getElementById('cmt-head').textContent)
       && !!d3.querySelector(`.cm-box.sel[data-key="${TOUR.steps[0].subject}"]`),
       d3.getElementById('cmt-head').textContent);
    let stepsOk = true, stepsWhy = '';
    for (let i = 1; i < TOUR.steps.length; i++) {
      d3.getElementById('cmt-next').click();
      await sleep(30);
      const head = d3.getElementById('cmt-head').textContent;
      const st = TOUR.steps[i];
      if (!head.startsWith(`step ${i + 1} of`)) { stepsOk = false; stepsWhy = `after ${i} clicks: "${head}"`; break; }
      if (!d3.querySelector(`.cm-box.sel[data-key="${st.subject}"]`)) { stepsOk = false; stepsWhy = `${st.subject} not selected`; break; }
      const broke = [...d3.querySelectorAll('.cmt-check.broke')];
      if (broke.length) { stepsOk = false; stepsWhy = `step ${i + 1} shows a broken check: ${broke[0].textContent}`; break; }
      if (!/moved at this edge:/.test(d3.getElementById('cmt-moved').textContent)) { stepsOk = false; stepsWhy = 'no measured moved list'; break; }
    }
    ok('Next walks every step, each subject selected, every check held, the moved list measured', stepsOk, stepsWhy);
    d3.getElementById('cmt-back').click();
    await sleep(30);
    ok('Back rewinds to the previous step',
       d3.getElementById('cmt-head').textContent.startsWith(`step ${TOUR.steps.length - 1} of`),
       d3.getElementById('cmt-head').textContent);
    // The header transport keeps working, and leaving the path says so. From
    // step 5 (+5), one header step lands on +6, which is still authored, so
    // it takes two to leave the path: +7 is between nothing and the tour has
    // to say so rather than show the nearest prose.
    const step3 = [...d3.querySelectorAll('.nav-tbtn')].find((b) => b.title === 'One half-cycle');
    step3.click(); step3.click();
    await sleep(30);
    ok('header steps off the authored path say so',
       /off the path/.test(d3.getElementById('cmt-head').textContent),
       d3.getElementById('cmt-head').textContent);
    d3.getElementById('cmt-back').click();
    await sleep(30);
    ok('and Back rejoins the walkthrough',
       /^step \d+ of/.test(d3.getElementById('cmt-head').textContent),
       d3.getElementById('cmt-head').textContent);
    d3.getElementById('cmt-exit').click();
    await sleep(30);
    ok('leaving the tour restores the page: panel hidden, selection cleared',
       d3.getElementById('cmt-panel').hidden
       && !d3.getElementById('cm-svg').classList.contains('has-sel')
       && !d3.querySelector('.cm-box.sel'),
       'panel or selection survived the exit');
    // --- the boxes drag, snapped, kept, and Tidy gives the layout back -------
    await load('chipmap.html');
    const d4 = f.contentDocument;
    const w4 = f.contentWindow;
    for (let i = 0; i < 2000 && !w4.__chipmap; i++) await sleep(50);
    const CELL2 = 13;
    const dragBox = (key, px, py) => {
      const doc = f.contentDocument, win = f.contentWindow;
      const box = doc.querySelector(`.cm-box[data-key="${key}"]`);
      const r = box.getBoundingClientRect();
      const o = { clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 };
      const ev = (type, x, y) => new win.PointerEvent(type, {
        bubbles: true, pointerId: 1, clientX: x, clientY: y,
      });
      box.dispatchEvent(ev('pointerdown', o.clientX, o.clientY));
      win.dispatchEvent(ev('pointermove', o.clientX + px / 2, o.clientY + py / 2));
      win.dispatchEvent(ev('pointermove', o.clientX + px, o.clientY + py));
      win.dispatchEvent(ev('pointerup', o.clientX + px, o.clientY + py));
    };
    dragBox('alu:bit3', 60, 40);
    const boxEl = d4.querySelector('.cm-box[data-key="alu:bit3"]');
    const tf = /translate\((-?[\d.]+) (-?[\d.]+)\)/.exec(boxEl.getAttribute('transform') || '');
    ok('a drag moves the box, snapped to the node grid’s cell',
       !!tf && (Number(tf[1]) % CELL2 === 0) && (Number(tf[2]) % CELL2 === 0)
       && (Number(tf[1]) !== 0 || Number(tf[2]) !== 0),
       boxEl.getAttribute('transform') || 'no transform');
    {
      const groups4 = w4.__chipmap.groups;
      const bundles4 = w4.__chipmap.bundles;
      const gi = groups4.findIndex((g) => g.key === 'alu:bit3');
      const g = groups4[gi];
      const bd = bundles4.find((b) => b.a === gi || b.b === gi);
      const line = d4.querySelector(`.cm-bd[data-b="${bd.i}"]`);
      const end = bd.a === gi ? ['x1', 'y1'] : ['x2', 'y2'];
      const want = [g.x + Number(tf[1]) + g.w / 2, g.y + Number(tf[2]) + g.h / 2];
      ok('its bundles follow the box',
         Math.abs(Number(line.getAttribute(end[0])) - want[0]) < 0.01
         && Math.abs(Number(line.getAttribute(end[1])) - want[1]) < 0.01,
         `${line.getAttribute(end[0])},${line.getAttribute(end[1])} vs ${want}`);
      ok('a real drag does not select the box', !boxEl.classList.contains('sel'));
      ok('the arrangement is kept', !!localStorage.getItem('v6502.chipmap.layout'));
    }
    await load('chipmap.html');
    for (let i = 0; i < 2000 && !f.contentWindow.__chipmap; i++) await sleep(50);
    const d5 = f.contentDocument;
    ok('a moved box still carries its offset across a second page load',
       /translate\(/.test(d5.querySelector('.cm-box[data-key="alu:bit3"]').getAttribute('transform') || ''),
       d5.querySelector('.cm-box[data-key="alu:bit3"]').getAttribute('transform') || 'none');
    d5.getElementById('cm-tidy').click();
    await sleep(30);
    ok('Tidy gives the derived layout back and forgets the arrangement',
       !d5.querySelector('.cm-box[data-key="alu:bit3"]').getAttribute('transform')
       && !localStorage.getItem('v6502.chipmap.layout'));

    // --- save and load: the arrangement as a file -----------------------------
    //
    // The file is the format the page states: container key to [dx, dy].
    // Loaded through the REAL file input via a DataTransfer, because a load
    // path tested by calling the function would never notice the input
    // unwired. Unknown keys are skipped and counted, never applied.
    dragBox('regs:a', 80, 55);
    await sleep(30);
    const savedText = f.contentWindow.__chipmap.layoutJSON();
    const savedObj = JSON.parse(savedText);
    const tfA = /translate\((-?[\d.]+) (-?[\d.]+)\)/.exec(
      d5.querySelector('.cm-box[data-key="regs:a"]').getAttribute('transform'));
    ok('the saved file is the container key and its snapped offset, nothing else',
       Array.isArray(savedObj['regs:a'])
       && savedObj['regs:a'][0] === Number(tfA[1]) && savedObj['regs:a'][1] === Number(tfA[2])
       && Object.values(savedObj).every((v) => Array.isArray(v) && v.length === 2),
       savedText.slice(0, 120));
    d5.getElementById('cm-tidy').click();
    await sleep(30);
    ok('Tidy clears it before the load',
       !d5.querySelector('.cm-box[data-key="regs:a"]').getAttribute('transform'));
    {
      const withJunk = { ...savedObj, 'no:such-container': [13, 13], 'alu:bit3': 'garbage' };
      const dt = new f.contentWindow.DataTransfer();
      dt.items.add(new f.contentWindow.File([JSON.stringify(withJunk)],
        'chipmap-layout.json', { type: 'application/json' }));
      const input = d5.getElementById('cm-load');
      input.files = dt.files;
      input.dispatchEvent(new f.contentWindow.Event('change', { bubbles: true }));
      // Poll for the note rather than sleeping: file.text() resolves on real
      // IO, and a fixed sleep under a virtual-time budget can fast-forward
      // straight past it. Found as a flake, one green run then one red.
      for (let i = 0; i < 400 && !/placed/.test(d5.getElementById('cm-io-note').textContent); i++) await sleep(25);
    }
    ok('Load puts the arrangement back through the real file input',
       d5.querySelector('.cm-box[data-key="regs:a"]').getAttribute('transform')
         === `translate(${savedObj['regs:a'][0]} ${savedObj['regs:a'][1]})`,
       d5.querySelector('.cm-box[data-key="regs:a"]').getAttribute('transform') || 'none');
    ok('...skipping and counting what it does not recognise',
       /2 unknown entries skipped/.test(d5.getElementById('cm-io-note').textContent),
       d5.getElementById('cm-io-note').textContent);
    ok('a loaded arrangement is kept like a dragged one',
       JSON.parse(localStorage.getItem('v6502.chipmap.layout') || '{}')['regs:a'] !== undefined);
    d5.getElementById('cm-tidy').click();
    await sleep(30);

    // --- scramble and optimize ------------------------------------------------
    //
    // The stretch is recomputed HERE, from the boxes' own transforms and the
    // bundle weights, so "optimizing reduces it" is not the page grading its
    // own work. The optimizer runs in setTimeout chunks precisely so it still
    // runs in this iframe, where animation frames are throttled to nothing.
    const stretchOf = () => {
      const gs = f.contentWindow.__chipmap.groups;
      const bs = f.contentWindow.__chipmap.bundles;
      const boxes5 = [...f.contentDocument.querySelectorAll('#cm-svg .cm-box')];
      const c = gs.map((g, i) => {
        const tfm = /translate\((-?[\d.]+) (-?[\d.]+)\)/.exec(boxes5[i].getAttribute('transform') || '');
        const dx = tfm ? Number(tfm[1]) : 0, dy = tfm ? Number(tfm[2]) : 0;
        return [g.x + dx + g.w / 2, g.y + dy + g.h / 2];
      });
      let sum = 0;
      for (const bd of bs) sum += bd.weight * Math.hypot(c[bd.a][0] - c[bd.b][0], c[bd.a][1] - c[bd.b][1]);
      return sum;
    };
    d5.getElementById('cm-scramble').click();
    await sleep(60);
    {
      const tfs = [...d5.querySelectorAll('#cm-svg .cm-box')].map((b) => b.getAttribute('transform') || '');
      const moved5 = tfs.filter((t) => /translate\((?!0 0\))/.test(t)).length;
      const snapped5 = tfs.every((t) => {
        const m2 = /translate\((-?[\d.]+) (-?[\d.]+)\)/.exec(t);
        return !m2 || (Number(m2[1]) % 13 === 0 && Number(m2[2]) % 13 === 0);
      });
      ok('Scramble throws nearly every box somewhere else, snapped',
         moved5 > 100 && snapped5, `${moved5} moved, snapped ${snapped5}`);
      ok('...and says what it did to the stretch',
         /scrambled: stretch \d+k/.test(d5.getElementById('cm-io-note').textContent),
         d5.getElementById('cm-io-note').textContent);
    }
    const sBefore = stretchOf();
    d5.getElementById('cm-opt').click();
    ok('Optimize becomes Stop while it runs', d5.getElementById('cm-opt').textContent === 'Stop');
    for (let i = 0; i < 1200 && !/settled after/.test(d5.getElementById('cm-io-note').textContent); i++) await sleep(50);
    ok('the optimizer settles and reports both stretches',
       /settled after \d+ steps: stretch \d+k, was \d+k/.test(d5.getElementById('cm-io-note').textContent),
       d5.getElementById('cm-io-note').textContent);
    const sAfter = stretchOf();
    ok('optimizing reduces the weighted stretch, measured by this harness',
       sAfter < sBefore * 0.9, `${Math.round(sAfter / 1000)}k vs ${Math.round(sBefore / 1000)}k scrambled`);
    {
      const gs = f.contentWindow.__chipmap.groups;
      const boxes5 = [...d5.querySelectorAll('#cm-svg .cm-box')];
      const sane = gs.every((g, i) => {
        const tfm = /translate\((-?[\d.]+) (-?[\d.]+)\)/.exec(boxes5[i].getAttribute('transform') || '');
        const dx = tfm ? Number(tfm[1]) : 0, dy = tfm ? Number(tfm[2]) : 0;
        // The run is unwalled, so a negative coordinate is legitimate; what
        // must hold is finite, snapped, and sane in magnitude. Boundedness
        // itself is the bbox assertion below.
        if (!Number.isFinite(dx) || !Number.isFinite(dy) || dx % 13 !== 0 || dy % 13 !== 0) return false;
        const cx = g.x + dx + g.w / 2, cy = g.y + dy + g.h / 2;
        return Math.abs(cx) < 1e5 && Math.abs(cy) < 1e5;
      });
      ok('the settled arrangement is snapped and finite everywhere', sane);
      // Free but not leaky: the run has no walls, and the weak gravity is
      // what keeps a container with no bundles from accelerating away for as
      // long as the cooling lets it (measured before it existed: one reached
      // 31,000 units out). The bound is generous; the bug it catches is an
      // order of magnitude past it.
      {
        let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
        gs.forEach((g, i) => {
          const tfm = /translate\((-?[\d.]+) (-?[\d.]+)\)/.exec(boxes5[i].getAttribute('transform') || '');
          const dx = tfm ? Number(tfm[1]) : 0, dy = tfm ? Number(tfm[2]) : 0;
          bx0 = Math.min(bx0, g.x + dx); bx1 = Math.max(bx1, g.x + dx + g.w);
          by0 = Math.min(by0, g.y + dy); by1 = Math.max(by1, g.y + dy + g.h);
        });
        ok('the free cloud stays a cloud: gravity holds the unwired pieces',
           bx1 - bx0 < 6000 && by1 - by0 < 6000,
           `${Math.round(bx1 - bx0)} x ${Math.round(by1 - by0)}`);
        d5.getElementById('cm-home').click();
        await sleep(30);
        const [vx, vy, vw, vh] = d5.getElementById('cm-svg').getAttribute('viewBox').split(' ').map(Number);
        ok('Fit frames wherever the boxes actually are',
           vx <= bx0 && vy <= by0 && vx + vw >= bx1 && vy + vh >= by1,
           `view ${vx},${vy} ${vw}x${vh} vs bbox ${bx0},${by0}..${bx1},${by1}`);
        // The settle de-overlaps: intersecting pairs are pushed apart with a
        // clearance the snap cannot steal back, so touching is legal and
        // stacking is not.
        let stacked = null;
        const rects = gs.map((g, i) => {
          const tfm = /translate\((-?[\d.]+) (-?[\d.]+)\)/.exec(boxes5[i].getAttribute('transform') || '');
          const dx = tfm ? Number(tfm[1]) : 0, dy = tfm ? Number(tfm[2]) : 0;
          return [g.x + dx, g.y + dy, g.w, g.h];
        });
        for (let i = 0; i < rects.length && !stacked; i++) {
          for (let j = i + 1; j < rects.length; j++) {
            const [ax, ay, aw, ah] = rects[i], [bx, by, bw, bh] = rects[j];
            if (ax < bx + bw && bx < ax + aw && ay < by + bh && by < ay + ah) {
              stacked = `${gs[i].key} ~ ${gs[j].key}`; break;
            }
          }
        }
        ok('no two boxes settle overlapping', !stacked, stacked || '');
      }
      ok('...and kept like a dragged one', !!localStorage.getItem('v6502.chipmap.layout'));
    }
    d5.getElementById('cm-tidy').click();
    await sleep(30);
    ok('Tidy still gives the derived layout back after the physics',
       ![...d5.querySelectorAll('#cm-svg .cm-box')].some((b) => b.getAttribute('transform')));

    // --- the study view: fullscreen with the floating console ----------------
    d5.getElementById('cm-fullscreen').click();
    let con = d5.querySelector('#view .console');
    for (let i = 0; i < 100 && !con.classList.contains('immersive'); i++) await sleep(50);
    const cr = con.getBoundingClientRect();
    const win = f.contentWindow;
    ok('fullscreen covers the viewport (the faux path, headless has no activation)',
       con.classList.contains('solo')
       && Math.abs(cr.width - win.innerWidth) < 2 && Math.abs(cr.height - win.innerHeight) < 2,
       `${cr.width}x${cr.height} vs ${win.innerWidth}x${win.innerHeight}`);
    ok('the console floats over the stage with the card borrowed into it',
       !!d5.querySelector('#cm-sp-panel .cm-card'));
    const tourTab = d5.querySelector('#cm-strip .sp-icon[data-tab="tour"]');
    tourTab.click();
    await sleep(30);
    ok('the Tour drawer holds the tour’s own elements',
       !!d5.querySelector('#cm-sp-panel #cmt-start'));
    const stepSolo = d5.getElementById('cm-solo-step');
    const h4 = f.contentWindow.__chipmap.machine.halfCycle();
    stepSolo.click();
    await sleep(30);
    ok('the strip’s transport steps the same chip',
       f.contentWindow.__chipmap.machine.halfCycle() === h4 + 1);
    d5.getElementById('cm-solo-exit').click();
    for (let i = 0; i < 100 && con.classList.contains('immersive'); i++) await sleep(50);
    ok('leaving puts every borrowed element back',
       !con.classList.contains('solo')
       && d5.getElementById('cm-card').parentElement.classList.contains('console')
       && d5.getElementById('cmt-start').parentElement.classList.contains('console-bar'));

    // --- the seeded scramble: the first throw is the same throw ---------------
    const firstThrow = async () => {
      localStorage.removeItem('v6502.chipmap.layout');
      await load('chipmap.html');
      for (let i = 0; i < 2000 && !f.contentWindow.__chipmap; i++) await sleep(50);
      f.contentDocument.getElementById('cm-scramble').click();
      await sleep(60);
      return f.contentDocument.querySelector('.cm-box[data-key="alu:bit3"]').getAttribute('transform');
    };
    const t1 = await firstThrow();
    const t2 = await firstThrow();
    ok('the first scramble of a fresh page is reproducible, as the prose claims',
       !!t1 && t1 === t2, `${t1} vs ${t2}`);
    localStorage.removeItem('v6502.chipmap.layout');
  } catch (e) {
    results.push('FAIL threw :: ' + (e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : e));
  }
  localStorage.removeItem('v6502.chipmap.layout');
  localStorage.removeItem('v6502.chipmap.console');
  const lines = results.filter((r) => r.startsWith('PASS') || r.startsWith('FAIL'));
  document.title = lines.length && lines.every((r) => r.startsWith('PASS')) ? 'ALL PASS' : 'FAILURES';
  document.body.insertAdjacentHTML('beforeend', '<pre id="out">' + results.join('\n') + '</pre>');
})();
</script>
</body></html>
